<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLD Letter Pairs Trainer</title>
<style>
:root {
  --bg: #111827;
  --surface: #1f2937;
  --surface2: #374151;
  --surface3: #4b5563;
  --accent: #6366f1;
  --accent-hover: #4f46e5;
  --success: #10b981;
  --warning: #f59e0b;
  --error: #ef4444;
  --text: #f9fafb;
  --text2: #9ca3af;
  --text3: #6b7280;
  --border: #374151;
  --radius: 8px;
  --radius-lg: 12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
button{cursor:pointer;font-family:inherit;font-size:inherit}
input,textarea{font-family:inherit;font-size:inherit}

/* ── Layout ── */
#app{display:flex;flex-direction:column;min-height:100vh;max-width:1100px;margin:0 auto;padding:0 12px}
header{padding:16px 0 0;border-bottom:1px solid var(--border);margin-bottom:16px}
.app-title{font-size:1.1rem;font-weight:700;color:var(--text);letter-spacing:.5px;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.app-title span{color:var(--accent)}
.tabs{display:flex;gap:4px}
.tab-btn{padding:8px 18px;border:none;background:transparent;color:var(--text2);border-radius:var(--radius) var(--radius) 0 0;font-weight:500;transition:background .15s,color .15s;position:relative;top:1px}
.tab-btn.active{background:var(--surface);color:var(--text);border:1px solid var(--border);border-bottom:1px solid var(--surface)}
.tab-btn:hover:not(.active){color:var(--text);background:var(--surface2)}
.tab-content{flex:1;padding-bottom:40px}

/* ── Progress badge ── */
.header-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.progress-badge{font-size:.8rem;color:var(--text2);padding:4px 10px;background:var(--surface);border-radius:20px;border:1px solid var(--border)}
.cloud-save-btn{padding:6px 12px;border:none;border-radius:999px;background:rgba(245,158,11,.16);color:var(--warning);border:1px solid rgba(245,158,11,.34);font-size:.78rem;font-weight:700;letter-spacing:.2px}
.cloud-save-btn:hover:not(:disabled){background:rgba(245,158,11,.28)}
.cloud-save-btn:disabled{opacity:.65;cursor:default}

/* ── Search Tab ── */
.search-container{max-width:640px;margin:0 auto}
.search-input-wrap{position:relative;margin-bottom:20px}
.search-input{width:100%;padding:14px 18px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-lg);color:var(--text);font-size:1.1rem;outline:none;letter-spacing:1px;text-transform:uppercase;transition:border-color .15s}
.search-input::placeholder{text-transform:none;letter-spacing:0;color:var(--text3)}
.search-input:focus{border-color:var(--accent)}
.search-input-hint{font-size:.8rem;color:var(--text3);margin-top:6px;margin-left:4px}

.pair-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px}
.pair-card-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.pair-code{font-size:2rem;font-weight:800;letter-spacing:4px;color:var(--text)}
.pair-status-badge{padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-set{background:rgba(16,185,129,.2);color:var(--success);border:1px solid rgba(16,185,129,.3)}
.badge-unset{background:rgba(245,158,11,.15);color:var(--warning);border:1px solid rgba(245,158,11,.3)}
.your-word-section{margin-bottom:16px}
.your-word-label{font-size:.75rem;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.your-word-display{font-size:1.2rem;font-weight:600;color:var(--success);margin-bottom:8px}
.edit-word-row{display:flex;gap:8px}
.edit-word-input{flex:1;padding:9px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);outline:none;transition:border-color .15s}
.edit-word-input:focus{border-color:var(--accent)}
.btn{padding:9px 18px;border:none;border-radius:var(--radius);font-weight:500;transition:background .15s,opacity .15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-sm{padding:5px 12px;font-size:.85rem}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-danger{background:rgba(239,68,68,.15);color:var(--error);border:1px solid rgba(239,68,68,.3)}
.btn-danger:hover{background:rgba(239,68,68,.25)}
.btn-success{background:rgba(16,185,129,.15);color:var(--success);border:1px solid rgba(16,185,129,.3)}
.btn-success:hover{background:rgba(16,185,129,.25)}
.suggestions-label{font-size:.75rem;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
.suggestions-grid{display:flex;flex-wrap:wrap;gap:8px}
.suggestion-pill{padding:6px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;font-size:.9rem;color:var(--text2);cursor:pointer;transition:all .15s}
.suggestion-pill:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.suggestion-pill.selected{background:var(--success);color:#fff;border-color:var(--success)}
.no-results{text-align:center;color:var(--text3);padding:40px;font-size:.95rem}

/* ── Browse Tab ── */
.browse-controls{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-btn{padding:6px 14px;border:1px solid var(--border);background:var(--surface);border-radius:20px;color:var(--text2);font-size:.85rem;cursor:pointer;transition:all .15s}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.browse-search{flex:1;min-width:140px;max-width:240px;padding:6px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);outline:none;font-size:.9rem}
.browse-search:focus{border-color:var(--accent)}
.grid-wrapper{overflow-x:auto}
.letter-grid{display:grid;grid-template-columns:24px repeat(26,32px);gap:2px;min-width:fit-content;margin-bottom:20px}
.grid-col-header,.grid-row-header{display:flex;align-items:center;justify-content:center;font-size:.65rem;color:var(--text3);font-weight:600;height:24px}
.grid-row-header{width:24px}
.grid-cell{width:32px;height:24px;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:600;letter-spacing:.5px;transition:transform .1s,opacity .1s;border:1px solid transparent;position:relative}
.grid-cell:hover{transform:scale(1.2);z-index:10;opacity:1!important}
.grid-cell.set{background:rgba(16,185,129,.25);color:var(--success);border-color:rgba(16,185,129,.4)}
.grid-cell.unset{background:rgba(245,158,11,.12);color:var(--warning);border-color:rgba(245,158,11,.2)}
.grid-cell.empty{background:var(--surface);color:var(--text3)}
.grid-cell.hidden{opacity:.15;pointer-events:none}
.grid-cell.focused{ring:2px solid var(--accent)}
.browse-list{display:flex;flex-direction:column;gap:6px}
.browse-list-item{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);cursor:pointer;transition:border-color .15s}
.browse-list-item:hover{border-color:var(--accent)}
.bli-code{font-weight:700;font-size:1rem;width:36px;letter-spacing:2px}
.bli-word{flex:1;font-size:.9rem}
.bli-word.set{color:var(--success)}
.bli-word.unset{color:var(--text3);font-style:italic}
.bli-suggestions{font-size:.8rem;color:var(--text3);max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Inline Edit Panel ── */
.inline-edit{background:var(--surface2);border:1px solid var(--accent);border-radius:var(--radius-lg);padding:16px;margin-bottom:16px}
.inline-edit-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.inline-edit-pair{font-size:1.5rem;font-weight:800;letter-spacing:4px}
.close-btn{background:none;border:none;color:var(--text3);font-size:1.2rem;padding:2px 8px;cursor:pointer}
.close-btn:hover{color:var(--text)}

/* ── Practice Tab ── */
.practice-setup{text-align:center;padding:20px 0}
.practice-setup h2{font-size:1.3rem;margin-bottom:20px;color:var(--text)}
.mode-grid{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.mode-card{padding:16px 24px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-lg);cursor:pointer;transition:all .15s;min-width:160px;text-align:center}
.mode-card:hover{border-color:var(--accent)}
.mode-card.selected{border-color:var(--accent);background:rgba(99,102,241,.1)}
.mode-card-title{font-weight:600;margin-bottom:4px}
.mode-card-desc{font-size:.8rem;color:var(--text3)}
.deck-opts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.practice-card-area{max-width:480px;margin:0 auto}
.practice-progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:.85rem;color:var(--text2)}
.practice-bar{flex:1;height:6px;background:var(--surface2);border-radius:3px;margin:0 12px;overflow:hidden}
.practice-bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.flip-card{perspective:800px;height:200px;margin-bottom:20px;cursor:pointer}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip-inner.flipped{transform:rotateY(180deg)}
.flip-front,.flip-back{position:absolute;inset:0;border-radius:var(--radius-lg);backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;border:2px solid var(--border)}
.flip-front{background:var(--surface)}
.flip-back{background:var(--surface);transform:rotateY(180deg)}
.flip-front-pair{font-size:3rem;font-weight:900;letter-spacing:8px}
.flip-front-hint{font-size:.8rem;color:var(--text3);margin-top:8px}
.flip-back-word{font-size:1.8rem;font-weight:700;color:var(--success);margin-bottom:8px}
.flip-back-pair{font-size:1rem;color:var(--text2);letter-spacing:3px;margin-bottom:6px}
.flip-back-suggestions{font-size:.8rem;color:var(--text3);text-align:center;max-width:300px}
.answer-btns{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
.answer-btn{padding:12px 28px;border:none;border-radius:var(--radius);font-size:.95rem;font-weight:600;cursor:pointer;transition:all .15s;flex:1;max-width:160px}
.answer-btn.know{background:rgba(16,185,129,.2);color:var(--success);border:1px solid rgba(16,185,129,.3)}
.answer-btn.know:hover{background:rgba(16,185,129,.35)}
.answer-btn.unsure{background:rgba(245,158,11,.15);color:var(--warning);border:1px solid rgba(245,158,11,.3)}
.answer-btn.unsure:hover{background:rgba(245,158,11,.3)}
.answer-btn.miss{background:rgba(239,68,68,.15);color:var(--error);border:1px solid rgba(239,68,68,.3)}
.answer-btn.miss:hover{background:rgba(239,68,68,.3)}
.session-stats{display:flex;gap:16px;justify-content:center;font-size:.85rem;color:var(--text2)}
.session-stat{text-align:center}
.session-stat .n{font-size:1.2rem;font-weight:700;color:var(--text)}
.practice-done{text-align:center;padding:40px 20px}
.practice-done h2{font-size:1.5rem;margin-bottom:12px}
.practice-done p{color:var(--text2);margin-bottom:24px}

/* ── Pieces Tab ── */
.pieces-setup{max-width:760px;margin:0 auto;padding:20px 0}
.pieces-setup h2{font-size:1.3rem;margin-bottom:10px;text-align:center}
.piece-summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:18px 0 20px}
.piece-summary-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px}
.piece-summary-card .n{font-size:1.4rem;font-weight:800;color:var(--text);margin-bottom:4px}
.piece-summary-card .label{font-size:.8rem;color:var(--text3);text-transform:uppercase;letter-spacing:.7px}
.piece-config-row{display:flex;gap:12px;align-items:end;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.piece-length-label{display:flex;flex-direction:column;gap:6px;font-size:.82rem;color:var(--text2)}
.piece-length-input{width:120px;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);outline:none}
.piece-length-input:focus{border-color:var(--accent)}
.piece-meta{font-size:.8rem;color:var(--text3);text-align:center}
.piece-history{margin-top:22px}
.piece-history-list{display:flex;flex-direction:column;gap:8px}
.piece-history-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.piece-history-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.piece-history-title{font-size:.92rem;font-weight:600;color:var(--text)}
.piece-history-meta{font-size:.78rem;color:var(--text3)}
.piece-history-score{font-size:1rem;font-weight:700;color:var(--accent);white-space:nowrap}
.piece-history-empty{text-align:center;color:var(--text3);padding:20px 12px;background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius-lg)}
.piece-prompt-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;margin-bottom:16px}
.piece-prompt-top{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:18px}
.piece-prompt-kicker{font-size:.76rem;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.piece-prompt-piece{font-size:2rem;font-weight:800;letter-spacing:4px;color:var(--text)}
.piece-target-chip{padding:6px 12px;border-radius:999px;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.28);color:var(--accent);font-size:.8rem;font-weight:600;white-space:nowrap}
.piece-question{text-align:center;font-size:.92rem;color:var(--text2);line-height:1.5}
.piece-visual{display:flex;justify-content:center;margin:0 auto 18px}
.piece-cubie-scene{position:relative;width:190px;height:170px;display:flex;align-items:center;justify-content:center;perspective:900px;perspective-origin:50% 35%}
.piece-cubie{position:relative;width:88px;height:88px;transform-style:preserve-3d;transition:transform .18s ease}
.piece-cubie-shadow{position:absolute;bottom:16px;left:50%;width:102px;height:30px;transform:translateX(-50%);border-radius:999px;background:radial-gradient(circle at center,rgba(0,0,0,.52) 0%,rgba(0,0,0,.22) 48%,rgba(0,0,0,0) 72%);filter:blur(10px);opacity:.85}
.piece-cubie-scene.edge-cubie{perspective-origin:50% 48%}
.piece-cubie-scene.edge-cubie .piece-cubie-shadow{width:114px;height:24px;bottom:20px}
.piece-cubie-scene.view-top-fr .piece-cubie{transform:rotateX(-28deg) rotateY(-42deg)}
.piece-cubie-scene.view-top-fl .piece-cubie{transform:rotateX(-28deg) rotateY(42deg)}
.piece-cubie-scene.view-top-br .piece-cubie{transform:rotateX(-28deg) rotateY(-138deg)}
.piece-cubie-scene.view-top-bl .piece-cubie{transform:rotateX(-28deg) rotateY(138deg)}
.piece-cubie-scene.view-bottom-fr .piece-cubie{transform:rotateX(28deg) rotateY(-42deg)}
.piece-cubie-scene.view-bottom-fl .piece-cubie{transform:rotateX(28deg) rotateY(42deg)}
.piece-cubie-scene.view-bottom-br .piece-cubie{transform:rotateX(28deg) rotateY(-138deg)}
.piece-cubie-scene.view-bottom-bl .piece-cubie{transform:rotateX(28deg) rotateY(138deg)}
.piece-cubie-scene.view-mid-fr .piece-cubie{transform:rotateX(-8deg) rotateY(-45deg)}
.piece-cubie-scene.view-mid-fl .piece-cubie{transform:rotateX(-8deg) rotateY(45deg)}
.piece-cubie-scene.view-mid-br .piece-cubie{transform:rotateX(-8deg) rotateY(-135deg)}
.piece-cubie-scene.view-mid-bl .piece-cubie{transform:rotateX(-8deg) rotateY(135deg)}
.piece-cubie-scene.view-edge-top-front .piece-cubie{transform:rotateX(-64deg) rotateY(0deg) scaleY(.9)}
.piece-cubie-scene.view-edge-top-back .piece-cubie{transform:rotateX(-64deg) rotateY(180deg) scaleY(.9)}
.piece-cubie-scene.view-edge-top-right .piece-cubie{transform:rotateX(-26deg) rotateY(-78deg) scaleY(.9)}
.piece-cubie-scene.view-edge-top-left .piece-cubie{transform:rotateX(-26deg) rotateY(78deg) scaleY(.9)}
.piece-cubie-scene.view-edge-bottom-front .piece-cubie{transform:rotateX(64deg) rotateY(0deg) scaleY(.9)}
.piece-cubie-scene.view-edge-bottom-back .piece-cubie{transform:rotateX(64deg) rotateY(180deg) scaleY(.9)}
.piece-cubie-scene.view-edge-bottom-right .piece-cubie{transform:rotateX(26deg) rotateY(-78deg) scaleY(.9)}
.piece-cubie-scene.view-edge-bottom-left .piece-cubie{transform:rotateX(26deg) rotateY(78deg) scaleY(.9)}
.piece-cubie-scene.view-edge-front-right .piece-cubie{transform:rotateX(-4deg) rotateY(-58deg) scaleY(.9)}
.piece-cubie-scene.view-edge-front-left .piece-cubie{transform:rotateX(-4deg) rotateY(58deg) scaleY(.9)}
.piece-cubie-scene.view-edge-back-right .piece-cubie{transform:rotateX(-4deg) rotateY(-122deg) scaleY(.9)}
.piece-cubie-scene.view-edge-back-left .piece-cubie{transform:rotateX(-4deg) rotateY(122deg) scaleY(.9)}
.piece-cubie-face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#1b2330,#0a0f19);border:1px solid rgba(255,255,255,.08);border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -10px 18px rgba(0,0,0,.28)}
.piece-cubie-face--front{transform:translateZ(44px)}
.piece-cubie-face--back{transform:rotateY(180deg) translateZ(44px)}
.piece-cubie-face--right{transform:rotateY(90deg) translateZ(44px)}
.piece-cubie-face--left{transform:rotateY(-90deg) translateZ(44px)}
.piece-cubie-face--top{transform:rotateX(90deg) translateZ(44px)}
.piece-cubie-face--bottom{transform:rotateX(-90deg) translateZ(44px)}
.piece-cubie--corner .piece-cubie-sticker{width:72px;height:72px;border-radius:16px}
.piece-cubie--edge .piece-cubie-sticker{width:78px;height:58px;border-radius:14px}
.piece-cubie-sticker{background:linear-gradient(135deg,rgba(255,255,255,.42) 0%,rgba(255,255,255,.1) 38%,rgba(0,0,0,.18) 100%),var(--sticker-color);border:2px solid rgba(0,0,0,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -8px 14px rgba(0,0,0,.2),0 4px 12px rgba(0,0,0,.18)}
.piece-cubie-sticker.plastic{background:linear-gradient(135deg,#2d3748,#111827 70%);border-color:rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 -10px 18px rgba(0,0,0,.36)}
.piece-cubie-sticker.target{box-shadow:0 0 0 3px #ffffff,0 0 0 7px rgba(99,102,241,.55),0 0 26px rgba(99,102,241,.45),inset 0 1px 0 rgba(255,255,255,.26),inset 0 -8px 14px rgba(0,0,0,.22);transform:translateZ(2px) scale(1.03)}
.piece-answer-row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.piece-answer-hint{font-size:.9rem;color:var(--text2);text-align:center}
.piece-auto-advance{font-size:.78rem;color:var(--text3)}
.piece-answer-result{padding:12px 14px;border-radius:var(--radius);margin-bottom:16px;text-align:center;font-weight:600}
.piece-answer-result.correct{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.32);color:var(--success)}
.piece-answer-result.incorrect{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.32);color:var(--error)}
.piece-answer-result-detail{display:block;font-size:.82rem;font-weight:400;color:var(--text2);margin-top:4px}

/* ── Settings Tab ── */
.settings-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px}
.settings-section h3{font-size:.95rem;font-weight:600;margin-bottom:14px;color:var(--text2);text-transform:uppercase;letter-spacing:.8px}
.settings-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.settings-row:last-child{margin-bottom:0}
.settings-info{font-size:.85rem;color:var(--text3);margin-bottom:10px}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:12px}
.settings-toggle{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);cursor:pointer}
.settings-toggle input{margin-top:3px;accent-color:var(--accent)}
.settings-toggle-title{font-size:.88rem;font-weight:600;color:var(--text)}
.settings-toggle-desc{font-size:.78rem;color:var(--text3);margin-top:2px;line-height:1.35}
.settings-select{padding:9px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);outline:none;min-width:160px}
.settings-number{width:120px;padding:9px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);outline:none}
.settings-select:focus,.settings-number:focus{border-color:var(--accent)}
.cloud-status-bar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:12px;background:var(--surface2);font-size:.85rem}
.cloud-status-bar.connected{border-color:rgba(16,185,129,.35);background:rgba(16,185,129,.08)}
.cloud-status-bar.pending{border-color:rgba(245,158,11,.28);background:rgba(245,158,11,.08)}
.cloud-status-bar.disconnected{border-color:var(--border)}
.cloud-status-icon{font-size:1rem;flex-shrink:0}
.cloud-status-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.cloud-status-title{font-weight:600;color:var(--text)}
.cloud-status-sub{font-size:.78rem;color:var(--text3);overflow-wrap:anywhere}
.cloud-input-label{display:flex;flex-direction:column;gap:6px;font-size:.82rem;color:var(--text2);flex:1;min-width:170px}
.cloud-input{width:100%;padding:9px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);outline:none}
.cloud-input:focus{border-color:var(--accent)}
.cloud-message{padding:10px 12px;border-radius:var(--radius);border:1px solid var(--border);font-size:.82rem;margin-bottom:12px}
.cloud-message.info{background:rgba(99,102,241,.08);border-color:rgba(99,102,241,.24);color:var(--text2)}
.cloud-message.success{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.28);color:var(--success)}
.cloud-message.warning{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.28);color:var(--warning)}
.cloud-message.error{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.28);color:var(--error)}
.cloud-file-list{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto}
.cloud-file-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--text);text-align:left}
.cloud-file-item:hover{border-color:var(--accent);background:rgba(99,102,241,.08)}
.cloud-file-name{font-size:.88rem;font-weight:600;word-break:break-word}
.cloud-file-meta{font-size:.76rem;color:var(--text3);white-space:nowrap}
.test-results{margin-top:14px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
.test-results-header{padding:8px 14px;background:var(--surface2);font-size:.85rem;font-weight:600;display:flex;justify-content:space-between}
.test-item{padding:8px 14px;font-size:.82rem;display:flex;align-items:center;gap:8px;border-top:1px solid var(--border)}
.test-item.pass{color:var(--success)}
.test-item.fail{color:var(--error)}
.test-icon{font-size:.9rem;flex-shrink:0}
.test-name{flex:1}
.test-error{font-size:.78rem;color:var(--error);margin-top:2px;opacity:.8}

/* ── Toast ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--surface2);color:var(--text);padding:10px 20px;border-radius:var(--radius-lg);border:1px solid var(--border);font-size:.9rem;transition:transform .25s;z-index:1000;pointer-events:none;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ── Keyboard hint ── */
.kbd-hint{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-size:.75rem;font-family:monospace;color:var(--text3);margin:0 2px}

/* ── Utility ── */
.mt8{margin-top:8px}
.mt12{margin-top:12px}
.mt16{margin-top:16px}
.flex{display:flex}
.items-center{align-items:center}
.gap8{gap:8px}

@media(max-width:600px){
  .tabs{gap:0}
  .tab-btn{padding:8px 10px;font-size:.85rem}
  .flip-front-pair{font-size:2.2rem;letter-spacing:5px}
  .flip-back-word{font-size:1.4rem}
  .answer-btn{padding:10px 14px;font-size:.85rem}
  .mode-grid{flex-direction:column;align-items:center}
  .mode-card{width:100%;max-width:300px}
  .pair-code{font-size:1.5rem}
  .piece-prompt-top{flex-direction:column;align-items:center;text-align:center}
  .piece-target-chip{white-space:normal}
  .piece-answer-row{flex-direction:column}
  .piece-cubie-scene{width:170px;height:154px}
  .piece-cubie{width:78px;height:78px}
  .piece-cubie-face--front{transform:translateZ(39px)}
  .piece-cubie-face--back{transform:rotateY(180deg) translateZ(39px)}
  .piece-cubie-face--right{transform:rotateY(90deg) translateZ(39px)}
  .piece-cubie-face--left{transform:rotateY(-90deg) translateZ(39px)}
  .piece-cubie-face--top{transform:rotateX(90deg) translateZ(39px)}
  .piece-cubie-face--bottom{transform:rotateX(-90deg) translateZ(39px)}
  .piece-cubie--corner .piece-cubie-sticker{width:64px;height:64px}
  .piece-cubie--edge .piece-cubie-sticker{width:68px;height:50px}
}
</style>

function normalizeGitHubRepo(repo, username = '') {
  const trimmed = String(repo || '').trim().replace(/^https?:\/\/github\.com\//i, '').replace(/\/+$/g, '');
  if (!trimmed) return '';
  if (!trimmed.includes('/')) return username ? `${username}/${trimmed}` : trimmed;
  const parts = trimmed.split('/').filter(Boolean);
  return parts.length >= 2 ? `${parts[0]}/${parts[1]}` : '';
}

function sanitizeGitHubPath(path) {
  const cleaned = String(path || '').trim().replace(/^\/+|\/+$/g, '');
  return cleaned || 'letter-pairs';
}

function sanitizeGitHubFilename(filename) {
  const trimmed = String(filename || '').trim() || 'letter-pairs-data.json';
  return trimmed.endsWith('.json') ? trimmed : `${trimmed}.json`;
}

function normalizeGitHubConfig(raw) {
  const defaults = createDefaultGitHubConfig();
  const username = raw && typeof raw.username === 'string' ? raw.username : defaults.username;
  const repo = raw && raw.repo ? normalizeGitHubRepo(raw.repo, username) : defaults.repo;
  return {
    token: raw && typeof raw.token === 'string' ? raw.token : defaults.token,
    repo,
    path: sanitizeGitHubPath(raw && raw.path),
    filename: sanitizeGitHubFilename(raw && raw.filename),

}

  const type = ['both', 'edges', 'corners'].includes(config.type) ? config.type : defaults.config.type;
  const length = clampNumber(config.length, 1, 48, defaults.config.length);
  const colorPalette = Object.prototype.hasOwnProperty.call(PIECE_COLOR_PALETTES, display.colorPalette)

  const autoAdvanceMs = clampNumber(display.autoAdvanceMs, 0, 3000, displayDefaults.autoAdvanceMs);
  const pickBool = key => display[key] === undefined ? displayDefaults[key] : !!display[key];
  return {

function getStableValue(value) {
  if (Array.isArray(value)) return value.map(getStableValue);
  if (value && typeof value === 'object') {
    const sorted = {};
    Object.keys(value).sort().forEach(key => {
      sorted[key] = getStableValue(value[key]);
    });
    return sorted;
  }
  return value;
}

function stableStringify(value, space = 0) {
  return JSON.stringify(getStableValue(value), null, space);
}

function hashString(text) {
  let hash = 2166136261;
  for (let i = 0; i < text.length; i++) {
    hash ^= text.charCodeAt(i);
    hash += (hash << 1) + (hash << 4) + (hash << 7) + (hash << 8) + (hash << 24);
  }
  return (hash >>> 0).toString(16);
}

  saveState();

function encodeBase64Unicode(text) {

async function signInWithGitHub() {

  const redirectUri = window.location.origin + window.location.pathname;
  const authUrl = `https://github.com/login/oauth/authorize?client_id=${encodeURIComponent(GITHUB_OAUTH_CLIENT_ID)}&scope=repo&redirect_uri=${encodeURIComponent(redirectUri)}`;
  window.location.href = authUrl;
}

async function handleGitHubOAuthCallback(code) {
  const prevConfig = normalizeGitHubConfig(ghConfig || createDefaultGitHubConfig());
  setCloudMessage('info', 'Completing GitHub sign-in…');
  render();
  try {
    const res = await fetch(GITHUB_OAUTH_PROXY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ client_id: GITHUB_OAUTH_CLIENT_ID, code })
    });
    if (!res.ok) throw new Error('OAuth token exchange failed');
    const data = await res.json();
    if (!data.access_token) throw new Error('No access token received');

    const userRes = await fetch('https://api.github.com/user', {
      headers: { Authorization: `Bearer ${data.access_token}`, Accept: 'application/vnd.github.v3+json' }
    });
    const userData = userRes.ok ? await userRes.json() : { login: '' };

    ghConfig = normalizeGitHubConfig({
      token: data.access_token,
      repo: prevConfig.repo,
      path: prevConfig.path,
      filename: prevConfig.filename,
      username: userData.login || prevConfig.username
    });
    saveGitHubConfig();
    resetCloudSyncSnapshot();
    setCloudMessage('success', `Signed in as ${ghConfig.username || 'GitHub user'}. Configure a repo to enable saves.`);
  } catch (err) {
    setCloudMessage('error', `GitHub sign-in failed: ${err.message}`);
  }
  currentTab = 'settings';
  render();
}

async function processGitHubOAuthRedirect() {
  if (typeof window === 'undefined' || !window.location || typeof URLSearchParams === 'undefined') return;
  const params = new URLSearchParams(window.location.search || '');
  const code = params.get('code');
  if (!code) return;
  await handleGitHubOAuthCallback(code);
  params.delete('code');
  params.delete('state');
  const nextQuery = params.toString();
  const nextUrl = `${window.location.pathname}${nextQuery ? `?${nextQuery}` : ''}${window.location.hash || ''}`;
  if (window.history && window.history.replaceState) {
    window.history.replaceState({}, (typeof document !== 'undefined' && document.title) ? document.title : '', nextUrl);
  }
}

async function connectGitHubRepo() {
  if (!isGitHubAuthenticated()) {
    setCloudMessage('warning', 'Sign in with GitHub first.');
    render();
    return;
  }
  const next = applyGitHubSettingsFromInputs();
  if (!next.repo) {
    setCloudMessage('warning', 'Enter a GitHub repository first.');
    render();
    return;
  }
  setCloudMessage('info', `Checking ${next.repo}…`);
  render();
  try {
    const res = await fetch(`https://api.github.com/repos/${next.repo}`, {
      headers: { Authorization: `Bearer ${ghConfig.token}`, Accept: 'application/vnd.github.v3+json' }
    });
    if (res.ok) {
      setCloudMessage('success', `Connected to ${next.repo}/${next.path}.`);
      updateCloudDirtyState();
      await refreshGitHubFiles(false);
    } else if (res.status === 404) {
      setCloudMessage('warning', `Repository ${next.repo} was not found. Use “Create Private Repo” or choose another repo.`);
    } else {
      setCloudMessage('error', `Failed to check repository (HTTP ${res.status}).`);
    }
  } catch (err) {
    setCloudMessage('error', `Failed to check repository: ${err.message}`);
  }
  render();
}

async function createGitHubRepo() {
  if (!isGitHubAuthenticated()) {
    setCloudMessage('warning', 'Sign in with GitHub first.');
    render();
    return;
  }
  const next = applyGitHubSettingsFromInputs();
  if (!next.repo) {
    setCloudMessage('warning', 'Enter a repository name first.');
    render();
    return;
  }
  const [owner, repoName] = next.repo.split('/');
  if (!owner || !repoName) {
    setCloudMessage('warning', 'Repository must look like owner/name.');
    render();
    return;
  }
  if (owner !== ghConfig.username) {
    setCloudMessage('warning', 'You can only create repositories in your own GitHub account.');
    render();
    return;
  }
  setCloudMessage('info', `Creating private repo ${next.repo}…`);
  render();
  try {
    const res = await fetch('https://api.github.com/user/repos', {
      method: 'POST',
      headers: {
        Authorization: `Bearer ${ghConfig.token}`,
        Accept: 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        name: repoName,
        description: 'BLD Letter Pairs Trainer data storage',
        private: true,
        auto_init: true
      })
    });
    if (!res.ok && res.status !== 201) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.message || `HTTP ${res.status}`);
    }
    setCloudMessage('success', `Created ${next.repo}.`);
    updateCloudDirtyState();
    await refreshGitHubFiles(false);
  } catch (err) {
    setCloudMessage('error', `Failed to create repository: ${err.message}`);
  }
  render();
}

async function refreshGitHubFiles(shouldRender = true) {
  if (!isGitHubReady()) {
    cloudState.files = [];
    if (shouldRender) render();
    return;
  }
  try {
    const res = await fetch(`https://api.github.com/repos/${ghConfig.repo}/contents/${ghConfig.path}`, {
      headers: { Authorization: `Bearer ${ghConfig.token}`, Accept: 'application/vnd.github.v3+json' }
    });
    if (res.status === 404) {
      cloudState.files = [];
      setCloudMessage('info', `No files yet in ${ghConfig.path}/.`);
    } else if (!res.ok) {
      cloudState.files = [];
      setCloudMessage('error', `Failed to load GitHub files (HTTP ${res.status}).`);
    } else {
      const files = await res.json();
      cloudState.files = Array.isArray(files) ? files.filter(file => file && file.name && file.name.endsWith('.json')) : [];
      if (!cloudState.message || cloudState.message.type === 'info') clearCloudMessage();
    }
  } catch (err) {
    cloudState.files = [];
    setCloudMessage('error', `Failed to load GitHub files: ${err.message}`);
  }
  if (shouldRender) render();
}

async function loadGitHubFile(filePath, fileName) {
  if (!isGitHubReady()) return;
  if (cloudState.hasUnsavedChanges && !confirm('Load a GitHub file and discard current unsaved cloud changes?')) return;
  setCloudMessage('info', `Loading ${fileName}…`);
  render();
  try {
    const res = await fetch(`https://api.github.com/repos/${ghConfig.repo}/contents/${filePath}`, {
      headers: { Authorization: `Bearer ${ghConfig.token}`, Accept: 'application/vnd.github.v3+json' }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const fileData = await res.json();
    const decoded = decodeBase64Unicode(fileData.content || '');
    importJSON(decoded);
    ghConfig.filename = sanitizeGitHubFilename(fileName);
    saveGitHubConfig();
    markCloudSyncSnapshot(getCloudPayloadString(false));
    setCloudMessage('success', `Loaded ${fileName} from GitHub.`);
    render();
  } catch (err) {
    setCloudMessage('error', `Failed to load ${fileName}: ${err.message}`);
    render();
  }
}

async function saveToGitHub() {
  if (!isGitHubReady()) {
    currentTab = 'settings';
    setCloudMessage('warning', 'Connect a GitHub repo first.');
    render();
    return;
  }
  ghConfig.filename = sanitizeGitHubFilename(ghConfig.filename);
  saveGitHubConfig();
  const filePath = `${ghConfig.path}/${ghConfig.filename}`;
  const payloadPretty = getCloudPayloadString(true);
  const payloadStable = getCloudPayloadString(false);
  cloudState.saving = true;
  setCloudMessage('info', `Saving ${ghConfig.filename}…`);
  render();
  try {
    const existingRes = await fetch(`https://api.github.com/repos/${ghConfig.repo}/contents/${filePath}`, {
      headers: { Authorization: `Bearer ${ghConfig.token}`, Accept: 'application/vnd.github.v3+json' }
    });
    let sha = null;
    if (existingRes.ok) {
      const existing = await existingRes.json();
      sha = existing.sha;
    }

    const body = {
      message: `Update ${ghConfig.filename} via Letter Pairs Trainer`,
      content: encodeBase64Unicode(payloadPretty)
    };
    if (sha) body.sha = sha;

    const saveRes = await fetch(`https://api.github.com/repos/${ghConfig.repo}/contents/${filePath}`, {
      method: 'PUT',
      headers: {
        Authorization: `Bearer ${ghConfig.token}`,
        Accept: 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });
    if (!saveRes.ok) {
      const errData = await saveRes.json().catch(() => ({}));
      throw new Error(errData.message || `HTTP ${saveRes.status}`);
    }

    cloudState.syncPayload = payloadStable;
    updateCloudDirtyState();
    setCloudMessage('success', `Saved ${ghConfig.filename} to ${ghConfig.repo}/${ghConfig.path}.`);
    await refreshGitHubFiles(false);
    showToast('Saved to GitHub');
  } catch (err) {
    setCloudMessage('error', `GitHub save failed: ${err.message}`);
  }
  cloudState.saving = false;
  render();
}

function disconnectGitHub() {
  ghConfig = normalizeGitHubConfig({ repo: ghConfig.repo, path: ghConfig.path, filename: ghConfig.filename });
  cloudState = createDefaultCloudState();
  saveGitHubConfig();
  render();
}

// ═══════════════════════════════════════════════════════════
// BUSINESS LOGIC
// ═══════════════════════════════════════════════════════════
function searchPairs(query) {
  const q = normalizeQueryForLetterSet(query.trim().toUpperCase());
  if (!q) return [];
  return getActivePairs().filter(p =>
    p.startsWith(q) ||
    (getUserWord(p) || '').toUpperCase().includes(q) ||
    (PAIRS_DATA[p] || []).some(s => s.toUpperCase().includes(q))
  ).sort((a, b) => {
    const aExact = a === q ? 0 : a.startsWith(q) ? 1 : 2;
    const bExact = b === q ? 0 : b.startsWith(q) ? 1 : 2;
    return aExact - bExact || a.localeCompare(b);
  });
}

function getPracticeQueue(mode) {
  // mode: 'forward' | 'fill' | 'weak' | 'reverse'
  const active = getActivePairs();
  let pairs;
  if (mode === 'fill') {
    pairs = active.filter(p => !getUserWord(p));
  } else if (mode === 'weak') {
    pairs = active.filter(p => getUserWord(p)).filter(p => {
      const s = state.stats[p];
      if (!s) return true; // never practiced → weak
      return s.incorrect > 0 && s.incorrect >= s.correct;
    });
    if (pairs.length === 0) pairs = active.filter(p => getUserWord(p));
  } else {
    pairs = active.filter(p => getUserWord(p));
  }
  // Shuffle
  return shuffle([...pairs]);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ── Letter-set helpers ──────────────────────────────────────
// A pair is valid when:
//   • The two letters are different (no same-sticker pairs)
//   • Neither letter is Z (universally excluded)
//   • AX mode: Y excluded
//   • AY mode: X excluded
//   • XY mode: X and Y refer to the SAME sticker; Y pairs are hidden
//              and queries for Y are redirected to X (X is canonical).
function isValidPairForLetterSet(pair, ls) {
  const A = pair[0], B = pair[1];
  if (A === B) return false;                         // same sticker
  if (A === 'Z' || B === 'Z') return false;          // Z always excluded
  if (ls === 'AX' && (A === 'Y' || B === 'Y')) return false;
  if (ls === 'AY' && (A === 'X' || B === 'X')) return false;
  if (ls === 'XY' && (A === 'Y' || B === 'Y')) return false; // X is canonical
  return true;
}

function getActivePairs() {
  const ls = state.letterSet || 'AX';
  return ALL_PAIRS.filter(p => isValidPairForLetterSet(p, ls));
}

// In XY mode, a query containing Y is normalised to use X (canonical).
function normalizeQueryForLetterSet(q) {
  if ((state.letterSet || 'AX') === 'XY') return q.replace(/Y/g, 'X');
  return q;
}

function updateStats(pair, result) {
  // result: 'know' | 'unsure' | 'miss'
  if (!state.stats[pair]) state.stats[pair] = { correct: 0, incorrect: 0, streak: 0 };
  const s = state.stats[pair];
  if (result === 'know') { s.correct++; s.streak = (s.streak || 0) + 1; }
  else if (result === 'unsure') { s.streak = 0; }
  else { s.incorrect++; s.streak = 0; }
  s.lastSeen = Date.now();
  saveState();
}

function getStats(pair) {
  return state.stats[pair] || { correct: 0, incorrect: 0, streak: 0 };
}

function countSet() {
  return getActivePairs().filter(p => getUserWord(p)).length;
}

function totalActive() {
  return getActivePairs().length;
}

function buildPiecePrompts() {
  const prompts = [];
  SPEFFZ_FACE_SCHEME.forEach(group => {
    group.letters.split('').forEach((letter, index) => {
      const cornerPiece = group.corners[index];
      const edgePiece = group.edges[index];
      prompts.push({
        id: `corner-${cornerPiece}-${group.face}`,
        category: 'corner',
        piece: cornerPiece,
        targetFace: group.face,
        faces: cornerPiece.split(''),
        baseLetter: letter
      });
      prompts.push({
        id: `edge-${edgePiece}-${group.face}`,
        category: 'edge',
        piece: edgePiece,
        targetFace: group.face,
        faces: edgePiece.split(''),
        baseLetter: letter
      });
    });
  });
  return prompts;
}

function getPiecePromptById(promptId) {
  return PIECE_PROMPTS_BY_ID[promptId] || null;
}

function getPiecePromptPool(type) {
  if (type === 'edges') return PIECE_PROMPTS.filter(prompt => prompt.category === 'edge');
  if (type === 'corners') return PIECE_PROMPTS.filter(prompt => prompt.category === 'corner');
  return PIECE_PROMPTS.slice();
}

function getPieceTrainerConfig() {
  if (!state.pieceTrainer) state.pieceTrainer = createDefaultPieceTrainerState();
  return state.pieceTrainer.config;
}

function getPieceTrainerDisplaySettings() {
  if (!state.pieceTrainer) state.pieceTrainer = createDefaultPieceTrainerState();
  if (!state.pieceTrainer.display) state.pieceTrainer.display = createDefaultPieceTrainerDisplaySettings();
  return state.pieceTrainer.display;
}

function getPieceFaceColors() {
  const display = getPieceTrainerDisplaySettings();
  return PIECE_COLOR_PALETTES[display.colorPalette] || PIECE_COLOR_PALETTES.vivid;
}

function getPiecePracticeAutoAdvanceMs() {
  return clampNumber(getPieceTrainerDisplaySettings().autoAdvanceMs, 0, 3000, 650);
}

function getPiecePromptExpectedLetter(prompt, letterSet = state.letterSet || 'AX') {
  if (!prompt) return '';
  if (prompt.baseLetter === 'X' && letterSet === 'AY') return 'Y';
  return prompt.baseLetter;
}

function getPiecePromptAcceptedLetters(prompt, letterSet = state.letterSet || 'AX') {
  if (!prompt) return [];
  if (prompt.baseLetter === 'X' && letterSet === 'XY') return ['X', 'Y'];
  return [getPiecePromptExpectedLetter(prompt, letterSet)];
}

function getPiecePromptAnswerLabel(prompt, letterSet = state.letterSet || 'AX') {
  return getPiecePromptAcceptedLetters(prompt, letterSet).join(' / ');
}

function buildPiecePracticeDeck(type, length) {
  const pool = getPiecePromptPool(type).map(prompt => prompt.id);
  if (pool.length === 0) return [];
  const size = clampNumber(length, 1, pool.length, Math.min(12, pool.length));
  return shuffle(pool.slice()).slice(0, size);
}

function getPiecePromptStats(promptId) {
  return state.pieceTrainer.stats[promptId] || { correct: 0, incorrect: 0, lastSeen: 0 };
}

function updatePiecePromptStats(promptId, correct) {
  if (!state.pieceTrainer.stats[promptId]) {
    state.pieceTrainer.stats[promptId] = { correct: 0, incorrect: 0, lastSeen: 0 };
  }
  const stats = state.pieceTrainer.stats[promptId];
  if (correct) stats.correct++;
  else stats.incorrect++;
  stats.lastSeen = Date.now();
  saveState();
}

function getPieceTrainerLifetimeStats() {
  return Object.values(state.pieceTrainer.stats).reduce((acc, stats) => {
    acc.correct += stats.correct || 0;
    acc.incorrect += stats.incorrect || 0;
    return acc;
  }, { correct: 0, incorrect: 0 });
}

function recordPiecePracticeHistory(session) {
  const reviewed = session.stats.correct + session.stats.incorrect;
  if (session.historySaved || reviewed === 0) return;
  state.pieceTrainer.history.unshift({
    timestamp: Date.now(),
    type: session.type,
    length: session.deck.length,
    reviewed,
    correct: session.stats.correct,
    incorrect: session.stats.incorrect,
    letterSet: state.letterSet || 'AX'
  });
  state.pieceTrainer.history = state.pieceTrainer.history.slice(0, 12);
  session.historySaved = true;
  saveState();
}

let pieceAdvanceTimer = null;

function clearPiecePracticeAdvanceTimer() {
  if (pieceAdvanceTimer) clearTimeout(pieceAdvanceTimer);
  pieceAdvanceTimer = null;
}

function schedulePiecePracticeAdvance() {
  clearPiecePracticeAdvanceTimer();
  const delay = getPiecePracticeAutoAdvanceMs();
  if (delay <= 0) return;
  pieceAdvanceTimer = setTimeout(() => {
    pieceAdvanceTimer = null;
    if (piecePracticeSession && !piecePracticeSession.done && piecePracticeSession.checked && piecePracticeSession.result && !piecePracticeSession.result.revealed) {
      advancePiecePractice();
    }
  }, delay);
}

function startPiecePracticeSession(options = {}) {
  const config = getPieceTrainerConfig();
  const type = ['both', 'edges', 'corners'].includes(options.type) ? options.type : config.type;
  const max = getPiecePromptPool(type).length;
  const length = clampNumber(options.length, 1, max, clampNumber(config.length, 1, max, Math.min(12, max)));
  const deck = buildPiecePracticeDeck(type, length);
  if (deck.length === 0) return null;
  clearPiecePracticeAdvanceTimer();
  piecePracticeSession = {
    type,
    deck,
    index: 0,
    answer: '',
    checked: false,
    result: null,
    stats: { correct: 0, incorrect: 0 },
    startedAt: Date.now(),
    done: false,
    historySaved: false
  };
  return piecePracticeSession;
}

function submitPiecePracticeAnswer(answer, reveal = false) {
  const session = piecePracticeSession;
  if (!session || session.done || session.checked) return null;
  const prompt = getPiecePromptById(session.deck[session.index]);
  const typed = String(answer || '').trim().toUpperCase().slice(0, 1);
  const accepted = getPiecePromptAcceptedLetters(prompt);
  const correct = !reveal && accepted.includes(typed);
  clearPiecePracticeAdvanceTimer();
  session.answer = typed;
  session.checked = true;
  session.result = {
    typed,
    correct,
    expected: getPiecePromptExpectedLetter(prompt),
    accepted,
    revealed: reveal
  };
  if (correct) session.stats.correct++;
  else session.stats.incorrect++;
  updatePiecePromptStats(prompt.id, correct);
  if (!reveal) schedulePiecePracticeAdvance();
  render();
  return session.result;
}

function advancePiecePractice() {
  const session = piecePracticeSession;
  if (!session || session.done || !session.checked) return;
  clearPiecePracticeAdvanceTimer();
  session.index++;
  if (session.index >= session.deck.length) {
    session.done = true;
    recordPiecePracticeHistory(session);
  } else {
    session.answer = '';
    session.checked = false;
    session.result = null;
  }
  render();
}

function endPiecePracticeSession() {
  if (!piecePracticeSession) return;
  clearPiecePracticeAdvanceTimer();
  piecePracticeSession.done = true;
  recordPiecePracticeHistory(piecePracticeSession);
  render();
}

// TOAST
