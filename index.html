let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ═══════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════
function render() {
  // Remember which element was focused and its cursor position so we can
  // restore them after re-creating the DOM.
  const prevId   = document.activeElement ? document.activeElement.id : null;
  const prevSel  = (prevId && document.activeElement.selectionStart != null)
    ? document.activeElement.selectionStart : null;

  const app = document.getElementById('app');
  app.innerHTML = renderHeader() + `<div class="tab-content">${renderTab()}</div>`;
  attachHandlers();

  // Restore search-input cursor if it was the active element
  if (prevId === 'searchInput' && currentTab === 'search') {
    const inp = document.getElementById('searchInput');
    if (inp) {
      inp.focus();
      const pos = prevSel !== null ? prevSel : inp.value.length;
      inp.setSelectionRange(pos, pos);
    }
  }

  // Auto-focus the reverse-mode text input when a new card starts
  if (practiceSession && !practiceSession.done &&
      practiceSession.mode === 'reverse' && !practiceSession.reverseEval) {
    const ri = document.getElementById('reverseInput');
    if (ri) ri.focus();
  }
}

function renderHeader() {
  const set = countSet();
  const total = totalActive();
  const pct = total > 0 ? Math.round(set / total * 100) : 0;
  const showCloudSave = isGitHubReady() && (cloudState.hasUnsavedChanges || cloudState.saving);
  return `
<header>
  <div class="app-title">🧊 <span>BLD</span> Letter Pairs Trainer
    <div class="header-actions">
      ${showCloudSave ? `<button class="cloud-save-btn" id="headerCloudSave" ${cloudState.saving ? 'disabled' : ''}>${cloudState.saving ? 'Saving…' : 'Save to GitHub'}</button>` : ''}
      <span class="progress-badge">${set}/${total} set (${pct}%)</span>
    </div>
  </div>
  <div class="tabs">
    ${['search','browse','practice','pieces','settings'].map(t =>
      `<button class="tab-btn${currentTab===t?' active':''}" data-tab="${t}">${t.charAt(0).toUpperCase()+t.slice(1)}</button>`
    ).join('')}
  </div>
</header>`;
}

function renderTab() {
  if (currentTab === 'search') return renderSearch();
  if (currentTab === 'browse') return renderBrowse();
  if (currentTab === 'practice') return renderPractice();
  if (currentTab === 'pieces') return renderPieces();
  if (currentTab === 'settings') return renderSettings();
  return '';
}

// ── Search Tab ──────────────────────────────────────────────
function renderSearch() {
  const results = searchQuery.length >= 1 ? searchPairs(searchQuery) : [];
  // Normalize the query for exact-pair lookup (handles XY mode Y→X redirect)
  const normQ = normalizeQueryForLetterSet(searchQuery.trim().toUpperCase());
  const ls = state.letterSet || 'AX';
  const exactPair = normQ.length === 2 && PAIRS_DATA[normQ] && isValidPairForLetterSet(normQ, ls)
    ? normQ : null;
  // Show a redirect notice when XY mode redirects a Y query to X
  const redirectedFrom = (ls === 'XY' && searchQuery.trim().length === 2 &&
    searchQuery.trim().toUpperCase() !== normQ) ? searchQuery.trim().toUpperCase() : null;

  return `
<div class="search-container">
  <div class="search-input-wrap">
    <input id="searchInput" class="search-input" type="text" maxlength="26"
      placeholder="Type a pair (e.g. AB) or a word to search…"
      value="${esc(searchQuery)}" autocomplete="off" autocorrect="off" spellcheck="false">
    <div class="search-input-hint">
      Type 2 letters for a pair · or search by word &nbsp;·&nbsp;
      <span class="kbd-hint">/</span> focus &nbsp;·&nbsp;
      <span class="kbd-hint">Enter</span> edit word &nbsp;·&nbsp;
      <span class="kbd-hint">Esc</span> clear
    </div>
  </div>
  ${exactPair ? `
    ${redirectedFrom ? `<div style="font-size:.8rem;color:var(--warning);margin-bottom:8px;padding:6px 12px;background:rgba(245,158,11,.08);border-radius:var(--radius);border:1px solid rgba(245,158,11,.2)">↪ ${redirectedFrom} → ${exactPair} <span style="color:var(--text3)">(X/Y interchangeable)</span></div>` : ''}
    ${renderPairCard(exactPair, true)}` : ''}
  ${results.length > 0 && !exactPair ? `
    <div class="browse-list" id="searchResults">
      ${results.slice(0,20).map(p => renderBrowseListItem(p, true)).join('')}
    </div>
    ${results.length > 20 ? `<p style="color:var(--text3);font-size:.82rem;padding:8px 4px">…and ${results.length-20} more results</p>` : ''}
  ` : ''}
  ${searchQuery && results.length === 0 ? `<div class="no-results">No pairs found for "${esc(searchQuery)}"</div>` : ''}
  ${!searchQuery ? renderSearchSuggested() : ''}
</div>`;
}

function renderSearchSuggested() {
  const active = getActivePairs();
  const recent = active.filter(p => state.stats[p] && state.stats[p].lastSeen)
    .sort((a,b) => (state.stats[b].lastSeen||0) - (state.stats[a].lastSeen||0)).slice(0,6);
  const unset = active.filter(p => !getUserWord(p)).slice(0,6);

  let html = '';
  if (recent.length > 0) {
    html += `<div class="mt16"><div class="suggestions-label">Recently Practiced</div>
      <div class="suggestions-grid">${recent.map(p =>
        `<button class="suggestion-pill" data-quickpair="${p}">${p}${getUserWord(p) ? ' — '+esc(getUserWord(p)) : ''}</button>`
      ).join('')}</div></div>`;
  }
  if (unset.length > 0) {
    html += `<div class="mt16"><div class="suggestions-label">Missing Words (first ${unset.length})</div>
      <div class="suggestions-grid">${unset.map(p =>
        `<button class="suggestion-pill" data-quickpair="${p}">${p}</button>`
      ).join('')}</div></div>`;
  }
  return html;
}

function renderPairCard(pair, inline = false) {
  const word = getUserWord(pair);
  const suggestions = PAIRS_DATA[pair] || [];
  const stats = getStats(pair);
  const statsHtml = stats.correct + stats.incorrect > 0
    ? `<span style="font-size:.78rem;color:var(--text3)">✓${stats.correct} ✗${stats.incorrect}${stats.streak>1?' 🔥'+stats.streak:''}</span>`
    : '';

  return `
<div class="pair-card" data-pair="${pair}">
  <div class="pair-card-header">
    <span class="pair-code">${pair}</span>
    <span class="pair-status-badge ${word ? 'badge-set' : 'badge-unset'}">${word ? 'Set' : 'Not Set'}</span>
    ${statsHtml}
  </div>
  ${word ? `<div class="your-word-section">
    <div class="your-word-label">Your Word</div>
    <div class="your-word-display">${esc(word)}</div>
  </div>` : ''}
  <div class="your-word-section">
    <div class="your-word-label">${word ? 'Change Word' : 'Set Your Word'}</div>
    <div class="edit-word-row">
      <input class="edit-word-input" type="text" placeholder="Type your word…"
        value="${esc(word)}" data-edit-pair="${pair}" id="editInput-${pair}"
        autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="btn btn-primary" data-save-pair="${pair}">Save</button>
      ${word ? `<button class="btn btn-ghost btn-sm" data-clear-pair="${pair}">Clear</button>` : ''}
    </div>
  </div>
  ${suggestions.length > 0 ? `
  <div>
    <div class="suggestions-label">Suggestions</div>
    <div class="suggestions-grid">
      ${suggestions.map(s =>
        `<button class="suggestion-pill${word===s?' selected':''}" data-pick-word="${pair}" data-word="${esc(s)}">${esc(s)}</button>`
      ).join('')}
    </div>
  </div>` : ''}
</div>`;
}

// ── Browse Tab ──────────────────────────────────────────────
function renderBrowse() {
  const alpha = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const bq = browseSearch.trim().toUpperCase();

  // Determine which pairs to show/highlight
  const highlighted = new Set(
    bq ? searchPairs(bq) : getActivePairs()
  );

  let html = `
<div class="browse-controls">
  <input class="browse-search" id="browseSearch" type="text" placeholder="Filter pairs or words…"
    value="${esc(browseSearch)}" autocorrect="off" autocomplete="off" spellcheck="false">
  ${['all','set','unset'].map(f =>
    `<button class="filter-btn${browseFilter===f?' active':''}" data-filter="${f}">${f.charAt(0).toUpperCase()+f.slice(1)}</button>`
  ).join('')}
</div>`;

  if (browseEditPair) {
    html += `<div class="inline-edit">
      <div class="inline-edit-header">
        <span class="inline-edit-pair">${browseEditPair}</span>
        <button class="close-btn" data-close-edit>✕</button>
      </div>
      ${renderPairCard(browseEditPair)}
    </div>`;
  }

  // Grid view
  html += `<div class="grid-wrapper">
  <div class="letter-grid">
    <div></div>
    ${[...alpha].map(c => `<div class="grid-col-header">${c}</div>`).join('')}
    ${[...alpha].map(row => `
      <div class="grid-row-header">${row}</div>
      ${[...alpha].map(col => {
        const pair = row+col;
        const word = getUserWord(pair);
        const isVisible = shouldShowPair(pair, highlighted);
        let cls = 'grid-cell';
        if (!isVisible) cls += ' hidden';
        else if (word) cls += ' set';
        else if ((PAIRS_DATA[pair]||[]).length > 0) cls += ' unset';
        else cls += ' empty';
        if (browseEditPair === pair) cls += ' focused';
        return `<div class="${cls}" data-browse-pair="${pair}" title="${pair}${word ? ': '+word : ''}">${pair}</div>`;
      }).join('')}
    `).join('')}
  </div>
  </div>`;

  // List below grid
  const listPairs = getActivePairs().filter(p => shouldShowPair(p, highlighted));
  if (listPairs.length <= 50) {
    html += `<div class="browse-list" id="browseList" style="margin-top:16px">
      ${listPairs.map(p => renderBrowseListItem(p, false)).join('')}
    </div>`;
  } else {
    html += `<p style="color:var(--text3);font-size:.82rem;padding:8px 4px;margin-top:8px">
      ${listPairs.length} pairs match. Narrow your search to see a list view.
    </p>`;
  }

  return html;
}

function shouldShowPair(pair, highlighted) {
  if (!highlighted.has(pair)) return false;
  const word = getUserWord(pair);
  if (browseFilter === 'set' && !word) return false;
  if (browseFilter === 'unset' && word) return false;
  return true;
}

function renderBrowseListItem(pair, showStats) {
  const word = getUserWord(pair);
  const suggestions = PAIRS_DATA[pair] || [];
  const stats = getStats(pair);
  const statsStr = showStats && stats.correct + stats.incorrect > 0
    ? ` · ✓${stats.correct} ✗${stats.incorrect}` : '';
  return `<div class="browse-list-item" data-browse-pair="${pair}">
    <span class="bli-code">${pair}</span>
    <span class="bli-word ${word?'set':'unset'}">${word ? esc(word) : '— not set'}</span>
    ${suggestions.length > 0 ? `<span class="bli-suggestions">${suggestions.slice(0,4).map(esc).join(' · ')}${statsStr}</span>` : ''}
  </div>`;
}

// ── Practice Tab ────────────────────────────────────────────
function renderPractice() {
  if (!practiceSession) return renderPracticeSetup();
  if (practiceSession.done) return renderPracticeDone();
  return renderPracticeCard();
}

function renderPracticeSetup() {
  const active = getActivePairs();
  const setCount = active.filter(p => getUserWord(p)).length;
  const weakCount = getPracticeQueue('weak').length;
  const fillCount = active.filter(p => !getUserWord(p)).length;

  const modes = [
    { id: 'forward', title: '▶ Forward', desc: 'See pair → recall word', count: setCount, unit: 'set pairs' },
    { id: 'reverse', title: '◀ Reverse', desc: 'See word → recall pair', count: setCount, unit: 'set pairs' },
    { id: 'weak',   title: '⚡ Weak Pairs', desc: 'Focus on incorrect/unseen', count: weakCount, unit: 'weak pairs' },
    { id: 'fill',   title: '✏ Fill Missing', desc: 'Assign words to unset pairs', count: fillCount, unit: 'unset pairs' },
  ];

  return `
<div class="practice-setup">
  <h2>Choose Practice Mode</h2>
  <div class="mode-grid">
    ${modes.map(m => `
      <div class="mode-card${practiceMode===m.id?' selected':''}" data-mode="${m.id}">
        <div class="mode-card-title">${m.title}</div>
        <div class="mode-card-desc">${m.desc}</div>
        <div style="margin-top:8px;font-size:.8rem;color:var(--accent)">${m.count} ${m.unit}</div>
      </div>
    `).join('')}
  </div>
  ${setCount === 0 && practiceMode !== 'fill' ? `
    <p style="color:var(--warning);font-size:.9rem;margin-bottom:16px">
      ⚠ No words set yet. Use Fill Missing mode or set words in the Search tab first.
    </p>` : ''}
  <button class="btn btn-primary" id="startPractice"
    ${setCount === 0 && (practiceMode === 'forward' || practiceMode === 'reverse' || practiceMode === 'weak') ? 'disabled style="opacity:.5"' : ''}>
    Start Session →
  </button>
  <div style="margin-top:20px;font-size:.8rem;color:var(--text3);line-height:1.9">
    Select mode: <span class="kbd-hint">1</span> Forward · <span class="kbd-hint">2</span> Reverse · <span class="kbd-hint">3</span> Weak · <span class="kbd-hint">4</span> Fill &nbsp;·&nbsp; <span class="kbd-hint">Enter</span> start<br>
    During session: <span class="kbd-hint">Space</span> flip · <span class="kbd-hint">1</span> miss · <span class="kbd-hint">2</span> unsure · <span class="kbd-hint">3</span> know &nbsp;·&nbsp; <span class="kbd-hint">Esc</span> end
  </div>
</div>`;
}

function renderPracticeCard() {
  const s = practiceSession;
  const pair = s.deck[s.index];
  const word = getUserWord(pair);
  const suggestions = PAIRS_DATA[pair] || [];
  const progress = ((s.index) / s.deck.length * 100).toFixed(1);
  const isForward = s.mode !== 'reverse';
  const isFill = s.mode === 'fill';

  let frontContent, backContent;
  if (isFill) {
    frontContent = `<div class="flip-front-pair">${pair}</div><div class="flip-front-hint">Click to see suggestions</div>`;
    backContent = `
      <div class="flip-back-pair" style="margin-bottom:12px">${pair}</div>
      ${word ? `<div class="flip-back-word">${esc(word)}</div>` : ''}
      ${suggestions.length > 0 ? `<div class="flip-back-suggestions">${suggestions.slice(0,5).map(esc).join(' · ')}</div>` : ''}
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
        ${suggestions.slice(0,4).map(sug =>
          `<button class="suggestion-pill${word===sug?' selected':''}" data-pick-word="${pair}" data-word="${esc(sug)}">${esc(sug)}</button>`
        ).join('')}
      </div>
      <div class="edit-word-row" style="margin-top:8px;width:100%">
        <input class="edit-word-input" type="text" placeholder="Or type your word…"
          value="${esc(word)}" data-edit-pair="${pair}" id="editInput-${pair}" style="font-size:.9rem">
        <button class="btn btn-primary btn-sm" data-save-pair="${pair}">Set</button>
      </div>`;
  } else if (isForward) {
    frontContent = `<div class="flip-front-pair">${pair}</div><div class="flip-front-hint">What's your word? <span class="kbd-hint">Space</span> or click to reveal.</div>`;
    backContent = `
      <div class="flip-back-pair">${pair}</div>
      <div class="flip-back-word">${esc(word || '(no word set)')}</div>
      ${suggestions.length > 0 ? `<div class="flip-back-suggestions">Also: ${suggestions.filter(s=>s!==word).slice(0,3).map(esc).join(' · ')}</div>` : ''}`;
  } else {
    // Reverse mode — type the pair
    frontContent = `<div class="flip-front-pair" style="font-size:1.8rem;letter-spacing:2px">${esc(word)}</div><div class="flip-front-hint">Type the pair below ↓ or click to peek.</div>`;
    backContent = `
      <div class="flip-back-word" style="font-size:2.5rem;letter-spacing:6px">${pair}</div>
      <div class="flip-back-pair">${esc(word)}</div>`;
  }

  return `
<div class="practice-card-area">
  <div class="practice-progress">
    <span>${s.index+1} / ${s.deck.length}</span>
    <div class="practice-bar"><div class="practice-bar-fill" style="width:${progress}%"></div></div>
    <span>✓${s.stats.correct} ✗${s.stats.incorrect}</span>
  </div>
  <div class="flip-card" id="flipCard">
    <div class="flip-inner${s.flipped?' flipped':''}" id="flipInner">
      <div class="flip-front">${frontContent}</div>
      <div class="flip-back">${backContent}</div>
    </div>
  </div>

  ${/* ── Reverse mode: type-to-answer area ── */ !isForward && !isFill ? `
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:16px">
    ${!s.reverseEval ? `
      <div style="font-size:.78rem;color:var(--text3)">Type the pair <span class="kbd-hint">↵</span> to check &nbsp;·&nbsp; <span class="kbd-hint">Esc</span> skip</div>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="reverseInput" type="text" maxlength="2" autocomplete="off"
          autocorrect="off" spellcheck="false" autocapitalize="characters"
          placeholder="??" value=""
          style="width:72px;text-align:center;font-size:1.8rem;font-weight:700;letter-spacing:4px;
            text-transform:uppercase;padding:8px;background:var(--surface2);
            border:2px solid var(--accent);border-radius:var(--radius);color:var(--text);outline:none">
        <button class="btn btn-ghost btn-sm" id="reverseSubmitBtn">Check <span class="kbd-hint" style="font-size:.6rem">↵</span></button>
      </div>
    ` : `
      <div style="padding:10px 20px;border-radius:var(--radius);font-weight:600;
        background:${s.reverseEval.correct ? 'rgba(16,185,129,.12)' : 'rgba(239,68,68,.12)'};
        border:1px solid ${s.reverseEval.correct ? 'rgba(16,185,129,.35)' : 'rgba(239,68,68,.35)'};
        color:${s.reverseEval.correct ? 'var(--success)' : 'var(--error)'}">
        ${s.reverseEval.correct
          ? `✓ Correct! <span style="font-size:.78rem;font-weight:400;color:var(--text3)"> — <span class="kbd-hint">Enter</span> next</span>`
          : `✗ You typed <strong style="letter-spacing:2px">${esc(s.reverseEval.typed)}</strong>
             <span style="font-size:.78rem;font-weight:400;color:var(--text3)"> — <span class="kbd-hint">Enter</span> / <span class="kbd-hint">1</span>–<span class="kbd-hint">3</span> to continue</span>`
        }
      </div>
    `}
  </div>` : ''}

  ${isFill ? `
  <div class="answer-btns" style="${s.flipped?'':'opacity:.4;pointer-events:none'}">
    <button class="answer-btn know" data-answer="know">✓ Next <span class="kbd-hint" style="font-size:.65rem">↵</span></button>
    <button class="answer-btn miss" data-answer="skip">Skip <span class="kbd-hint" style="font-size:.65rem">Esc</span></button>
  </div>` : !isForward ? `
  <div class="answer-btns" style="${s.reverseEval?'':'opacity:.4;pointer-events:none'}">
    <button class="answer-btn miss" data-answer="miss">✗ Miss <span class="kbd-hint" style="font-size:.65rem">1</span></button>
    <button class="answer-btn unsure" data-answer="unsure">~ Unsure <span class="kbd-hint" style="font-size:.65rem">2</span></button>
    <button class="answer-btn know" data-answer="know">✓ Know <span class="kbd-hint" style="font-size:.65rem">3</span></button>
  </div>` : `
  <div class="answer-btns" style="${s.flipped?'':'opacity:.4;pointer-events:none'}">
    <button class="answer-btn miss" data-answer="miss">✗ Miss <span class="kbd-hint" style="font-size:.65rem">1</span></button>
    <button class="answer-btn unsure" data-answer="unsure">~ Unsure <span class="kbd-hint" style="font-size:.65rem">2</span></button>
    <button class="answer-btn know" data-answer="know">✓ Know <span class="kbd-hint" style="font-size:.65rem">3</span></button>
  </div>`}
  <div class="session-stats">
    <div class="session-stat"><div class="n" style="color:var(--success)">${s.stats.correct}</div><div>Correct</div></div>
    <div class="session-stat"><div class="n" style="color:var(--warning)">${s.stats.unsure||0}</div><div>Unsure</div></div>
    <div class="session-stat"><div class="n" style="color:var(--error)">${s.stats.incorrect}</div><div>Missed</div></div>
  </div>
  <div style="text-align:center;margin-top:16px">
    <button class="btn btn-ghost btn-sm" id="endSession">End Session</button>
  </div>
</div>`;
}

function renderPracticeDone() {
  const s = practiceSession;
  const total = s.stats.correct + s.stats.incorrect + (s.stats.unsure||0);
  const pct = total > 0 ? Math.round(s.stats.correct / total * 100) : 0;
  return `
<div class="practice-done">
  <h2>Session Complete! 🎉</h2>
  <p>${total} cards reviewed · ${pct}% correct</p>
  <div class="session-stats" style="margin-bottom:24px">
    <div class="session-stat"><div class="n" style="color:var(--success)">${s.stats.correct}</div><div>Correct</div></div>
    <div class="session-stat"><div class="n" style="color:var(--warning)">${s.stats.unsure||0}</div><div>Unsure</div></div>
    <div class="session-stat"><div class="n" style="color:var(--error)">${s.stats.incorrect}</div><div>Missed</div></div>
  </div>
  <button class="btn btn-primary" id="practiceAgain">Practice Again</button>
  <button class="btn btn-ghost" style="margin-left:8px" id="backToSetup">Change Mode</button>
</div>`;
}

// ── Pieces Tab ─────────────────────────────────────────────
function formatPieceSessionType(type) {
  if (type === 'edges') return 'Edges only';
  if (type === 'corners') return 'Corners only';
  return 'Edges + Corners';
}

function formatPieceHistoryTimestamp(timestamp) {
  return new Date(timestamp).toLocaleString([], {
    month: 'short',
    day: 'numeric',
    hour: 'numeric',
    minute: '2-digit'
  });
}

function formatPieceResultDetail(prompt, answerLabel, display, targetFaceLabel) {
  const parts = [];
  if (display.showPromptCode) parts.push(prompt.piece);
  if (display.showTargetFace) parts.push(targetFaceLabel);
  return `${parts.length > 0 ? parts.join(' · ') : 'Accepted answer'} = ${answerLabel}`;
}

function getPieceCubieView(prompt) {
  if (prompt.category === 'edge') {
    const edgeViews = {
      UF: 'view-edge-top-front',
      UB: 'view-edge-top-back',
      UR: 'view-edge-top-right',
      UL: 'view-edge-top-left',
      DF: 'view-edge-bottom-front',
      DB: 'view-edge-bottom-back',
      DR: 'view-edge-bottom-right',
      DL: 'view-edge-bottom-left',
      FR: 'view-edge-front-right',
      FL: 'view-edge-front-left',
      BR: 'view-edge-back-right',
      BL: 'view-edge-back-left'
    };
    return edgeViews[prompt.piece] || 'view-edge-front-right';
  }
  const has = face => prompt.faces.includes(face);
  if (has('U')) {
    if (has('F') && has('R')) return 'view-top-fr';
    if (has('F') && has('L')) return 'view-top-fl';
    if (has('B') && has('R')) return 'view-top-br';
    return 'view-top-bl';
  }
  if (has('D')) {
    if (has('F') && has('R')) return 'view-bottom-fr';
    if (has('F') && has('L')) return 'view-bottom-fl';
    if (has('B') && has('R')) return 'view-bottom-br';
    return 'view-bottom-bl';
  }
  if (has('F') && has('R')) return 'view-mid-fr';
  if (has('F') && has('L')) return 'view-mid-fl';
  if (has('B') && has('R')) return 'view-mid-br';
  return 'view-mid-bl';
}

function renderPieceCubieFace(slot, prompt) {
  const face = CUBIE_FACE_BY_SLOT[slot];
  const hasSticker = prompt.faces.includes(face);
  const isTarget = prompt.targetFace === face;
  const colors = getPieceFaceColors();
  return `
    <div class="piece-cubie-face piece-cubie-face--${slot}" aria-label="${FACE_LABELS[face] || face}">
      <div class="piece-cubie-sticker${hasSticker ? '' : ' plastic'}${isTarget ? ' target' : ''}" style="--sticker-color:${hasSticker ? colors[face] : '#111827'}"></div>
    </div>`;
}

function renderPieceVisual(prompt) {
  const viewClass = getPieceCubieView(prompt);
  const typeClass = prompt.category === 'edge' ? 'edge-cubie' : 'corner-cubie';
  return `
  <div class="piece-visual" data-piece-sticker="${prompt.id}" aria-label="${prompt.piece} ${prompt.targetFace} sticker">
    <div class="piece-cubie-scene ${viewClass} ${typeClass}">
      <div class="piece-cubie-shadow"></div>
      <div class="piece-cubie piece-cubie--${prompt.category}">
        ${Object.keys(CUBIE_FACE_BY_SLOT).map(slot => renderPieceCubieFace(slot, prompt)).join('')}
      </div>
    </div>
  </div>`;
}

function renderPieceHistory() {
  const history = state.pieceTrainer.history || [];
  if (history.length === 0) {
    return '<div class="piece-history-empty">No piece sessions yet. Start one and your recent results will appear here.</div>';
  }
  return `
  <div class="settings-section piece-history">
    <h3>Recent Piece Sessions</h3>
    <div class="piece-history-list">
      ${history.map(session => {
        const pct = session.reviewed > 0 ? Math.round(session.correct / session.reviewed * 100) : 0;
        const reviewedLabel = session.reviewed < session.length ? `${session.reviewed}/${session.length} reviewed` : `${session.reviewed} reviewed`;
        return `
        <div class="piece-history-item">
          <div class="piece-history-main">
            <div class="piece-history-title">${esc(formatPieceSessionType(session.type))} · ${reviewedLabel} · ${session.correct} correct</div>
            <div class="piece-history-meta">${esc(formatPieceHistoryTimestamp(session.timestamp))} · ${esc(session.letterSet || 'AX')}</div>
          </div>
          <div class="piece-history-score">${pct}%</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function renderPieces() {
  if (!piecePracticeSession) return renderPiecesSetup();
  if (piecePracticeSession.done) return renderPiecesDone();
  return renderPiecesCard();
}

function renderPiecesSetup() {
  const config = getPieceTrainerConfig();
  const display = getPieceTrainerDisplaySettings();
  const available = getPiecePromptPool(config.type).length;
  const length = clampNumber(config.length, 1, available, Math.min(12, available));
  const lifetime = getPieceTrainerLifetimeStats();
  const reviewed = lifetime.correct + lifetime.incorrect;
  const accuracy = reviewed > 0 ? Math.round(lifetime.correct / reviewed * 100) : 0;
  const typeOptions = [
    { id: 'both', title: 'Edges + Corners', desc: 'Mix all 48 Speffz stickers' },
    { id: 'edges', title: 'Edges', desc: 'Only edge stickers' },
    { id: 'corners', title: 'Corners', desc: 'Only corner stickers' }
  ];

  return `
<div class="pieces-setup">
  <h2>Practice Speffz From Pieces</h2>
  <div class="piece-meta">See a random piece and highlighted sticker, then type the matching letter.${display.showSchemeLabel ? ` The current scheme is <strong>${esc(state.letterSet || 'AX')}</strong>.` : ''}</div>

  ${display.showSetupSummary ? `
  <div class="piece-summary-grid">
    <div class="piece-summary-card">
      <div class="n">${PIECE_PROMPTS.length}</div>
      <div class="label">Total Stickers</div>
    </div>
    <div class="piece-summary-card">
      <div class="n">${reviewed}</div>
      <div class="label">Lifetime Attempts</div>
    </div>
    <div class="piece-summary-card">
      <div class="n">${accuracy}%</div>
      <div class="label">Lifetime Accuracy</div>
    </div>
  </div>` : ''}

  <div class="mode-grid">
    ${typeOptions.map(option => `
      <div class="mode-card${config.type === option.id ? ' selected' : ''}" data-piece-type="${option.id}">
        <div class="mode-card-title">${option.title}</div>
        <div class="mode-card-desc">${option.desc}</div>
        <div style="margin-top:8px;font-size:.8rem;color:var(--accent)">${getPiecePromptPool(option.id).length} prompts</div>
      </div>
    `).join('')}
  </div>

  <div class="piece-config-row">
    <label class="piece-length-label">
      <span>Session length</span>
      <input id="pieceSessionLength" class="piece-length-input" type="number" min="1" max="${available}" value="${length}">
    </label>
  </div>
  <div class="piece-meta" style="margin-bottom:18px">${available} prompts available in ${esc(formatPieceSessionType(config.type))}. In XY mode, the former X sticker accepts <strong>X</strong> or <strong>Y</strong>.</div>

  <div style="text-align:center;margin-bottom:18px">
    <button class="btn btn-primary" id="startPiecePractice">Start Piece Session →</button>
  </div>
  ${display.showKeyboardHelp ? `<div class="piece-meta" style="line-height:1.8;margin-bottom:22px">
    Setup shortcuts: <span class="kbd-hint">1</span> both · <span class="kbd-hint">2</span> edges · <span class="kbd-hint">3</span> corners · <span class="kbd-hint">Enter</span> start<br>
    During session: press the matching letter key · <span class="kbd-hint">Space</span> reveal/next · <span class="kbd-hint">Esc</span> end
  </div>` : ''}

  ${display.showHistory ? renderPieceHistory() : ''}
</div>`;
}

function renderPiecesCard() {
  const session = piecePracticeSession;
  const display = getPieceTrainerDisplaySettings();
  const prompt = getPiecePromptById(session.deck[session.index]);
  const progress = (session.index / session.deck.length * 100).toFixed(1);
  const stats = getPiecePromptStats(prompt.id);
  const seen = stats.correct + stats.incorrect;
  const seenPct = seen > 0 ? Math.round(stats.correct / seen * 100) : 0;
  const answerLabel = getPiecePromptAnswerLabel(prompt);
  const targetFaceLabel = FACE_LABELS[prompt.targetFace] || `${prompt.targetFace} face`;
  const autoAdvanceMs = getPiecePracticeAutoAdvanceMs();

  let resultBlock = '';
  if (session.checked && session.result) {
    const detail = session.result.correct
      ? formatPieceResultDetail(prompt, answerLabel, display, targetFaceLabel)
      : `${session.result.typed ? `You typed ${esc(session.result.typed)}.` : 'No answer recorded.'} Correct answer: ${answerLabel}`;
    resultBlock = `
    <div class="piece-answer-result ${session.result.correct ? 'correct' : 'incorrect'}">
      ${session.result.correct ? 'Correct' : (session.result.revealed ? 'Revealed' : 'Incorrect')}
      ${display.showResultDetails ? `<span class="piece-answer-result-detail">${detail}</span>` : ''}
    </div>`;
  }

  return `
<div class="practice-card-area">
  ${display.showSessionProgress ? `
  <div class="practice-progress">
    <span>${session.index + 1} / ${session.deck.length}</span>
    <div class="practice-bar"><div class="practice-bar-fill" style="width:${progress}%"></div></div>
    <span>✓${session.stats.correct} ✗${session.stats.incorrect}</span>
  </div>` : ''}

  <div class="piece-prompt-card">
    <div class="piece-prompt-top">
      ${(display.showPromptType || display.showPromptCode) ? `<div>
        ${display.showPromptType ? `<div class="piece-prompt-kicker">${prompt.category === 'corner' ? 'Corner piece' : 'Edge piece'}</div>` : ''}
        ${display.showPromptCode ? `<div class="piece-prompt-piece">${prompt.piece}</div>` : ''}
      </div>` : '<div></div>'}
      ${display.showTargetFace ? `<div class="piece-target-chip">Target: ${targetFaceLabel}</div>` : ''}
    </div>

    ${renderPieceVisual(prompt)}
    ${display.showQuestionText ? `<div class="piece-question">Which Speffz letter matches the highlighted sticker on this ${prompt.category} piece?</div>` : ''}
    ${display.showSeenStats ? `<div class="piece-meta" style="margin-top:12px">Seen before: ${seen} times${seen > 0 ? ` · ${seenPct}% correct` : ''}</div>` : ''}
  </div>

  <div class="piece-answer-row">
    ${!session.checked ? `
      <div class="piece-answer-hint">Press the matching letter key now.</div>
      <button class="btn btn-ghost" id="pieceRevealBtn">Show Answer</button>
    ` : `
      <div class="piece-answer-hint">${session.result && !session.result.revealed ? (autoAdvanceMs > 0 ? 'Moving to the next sticker…' : 'Ready for the next sticker.') : 'Answer revealed.'}</div>
      <button class="btn btn-primary" id="pieceNextBtn">${session.index === session.deck.length - 1 ? 'Finish Session' : 'Next Sticker →'}</button>
    `}
  </div>

  ${resultBlock}

  ${display.showAutoAdvanceHint && session.checked && !session.result.revealed && autoAdvanceMs > 0 ? `<div class="piece-auto-advance">Press <span class="kbd-hint">Space</span> to skip the wait.</div>` : ''}

  ${display.showSessionStats ? `
  <div class="session-stats">
    <div class="session-stat"><div class="n" style="color:var(--success)">${session.stats.correct}</div><div>Correct</div></div>
    <div class="session-stat"><div class="n" style="color:var(--error)">${session.stats.incorrect}</div><div>Missed</div></div>
  </div>` : ''}
  <div style="text-align:center;margin-top:16px">
    <button class="btn btn-ghost btn-sm" id="endPiecesSession">End Session</button>
  </div>
</div>`;
}

function renderPiecesDone() {
  const session = piecePracticeSession;
  const display = getPieceTrainerDisplaySettings();
  const reviewed = session.stats.correct + session.stats.incorrect;
  const pct = reviewed > 0 ? Math.round(session.stats.correct / reviewed * 100) : 0;
  const summary = reviewed < session.deck.length
    ? `${reviewed} of ${session.deck.length} stickers reviewed`
    : `${reviewed} stickers reviewed`;
  return `
<div class="practice-done">
  <h2>Piece Session Complete</h2>
  <p>${summary} · ${pct}% correct · ${esc(formatPieceSessionType(session.type))}</p>
  ${display.showSessionStats ? `
  <div class="session-stats" style="margin-bottom:24px">
    <div class="session-stat"><div class="n" style="color:var(--success)">${session.stats.correct}</div><div>Correct</div></div>
    <div class="session-stat"><div class="n" style="color:var(--error)">${session.stats.incorrect}</div><div>Missed</div></div>
  </div>` : ''}
  <button class="btn btn-primary" id="piecePracticeAgain">Practice Again</button>
  <button class="btn btn-ghost" style="margin-left:8px" id="pieceBackToSetup">Change Session</button>
</div>`;
}

function renderCloudMessage() {
  if (!cloudState.message) return '';
  return `<div class="cloud-message ${cloudState.message.type}">${esc(cloudState.message.text)}</div>`;
}

function renderGitHubFileList() {
  if (!isGitHubReady()) return '';
  if (cloudState.files.length === 0) {
    return `<div class="cloud-message info">No JSON files loaded yet. Use Refresh Files or save the current state first.</div>`;
  }
  return `
  <div class="cloud-file-list">
    ${cloudState.files.map(file => `
      <button class="cloud-file-item" data-gh-load-path="${esc(file.path)}" data-gh-load-name="${esc(file.name)}">
        <span class="cloud-file-name">${esc(file.name)}</span>
        <span class="cloud-file-meta">${Math.max(1, Math.round((file.size || 0) / 1024))} KB</span>
      </button>
    `).join('')}
  </div>`;
}

function renderGitHubSettingsSection() {
  const ready = isGitHubReady();
  const authenticated = isGitHubAuthenticated();
  const suggestedRepo = getSuggestedGitHubRepo();
  const repoValue = ghConfig.repo || suggestedRepo;
  const statusClass = ready ? 'connected' : authenticated ? 'pending' : 'disconnected';
  const statusIcon = ready ? '🟢' : authenticated ? '🟡' : '⚪';

// ═══════════════════════════════════════════════════════════
// EVENT HANDLERS
// ═══════════════════════════════════════════════════════════
function attachHandlers() {
  const app = document.getElementById('app');

  const headerCloudSave = document.getElementById('headerCloudSave');
  if (headerCloudSave) {
    headerCloudSave.addEventListener('click', () => {
      saveToGitHub();
    });
  }

  // Tab switching
  app.querySelectorAll('[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTab = btn.dataset.tab;
      if (currentTab !== 'pieces') clearPiecePracticeAdvanceTimer();
      render();
      if (currentTab === 'search') {
        const inp = document.getElementById('searchInput');
        if (inp) inp.focus();
      }
    });
  });

  // Search input
  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('input', e => {
      searchQuery = e.target.value;
      searchFocusPair = null;
      render();
      // render() restores focus+cursor automatically (see render())
    });
    searchInput.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        e.preventDefault();
        searchQuery = '';
        render();
        return;
      }
      if (e.key === 'Enter') {
        // Jump to the edit-word input when an exact pair is showing
        const normQ = normalizeQueryForLetterSet(searchQuery.trim().toUpperCase());
        const ls = state.letterSet || 'AX';
        if (normQ.length === 2 && PAIRS_DATA[normQ] && isValidPairForLetterSet(normQ, ls)) {
          e.preventDefault();
          const editInput = document.getElementById(`editInput-${normQ}`);
          if (editInput) { editInput.focus(); editInput.select(); }
        }
      }
    });
    // Focus is handled by: tab-switch handler + render() cursor-restore + init below
  }

  // Quick pair buttons (from search home)
  app.querySelectorAll('[data-quickpair]').forEach(btn => {
    btn.addEventListener('click', () => {
      searchQuery = btn.dataset.quickpair;
      render();
      const inp = document.getElementById('searchInput');
      if (inp) { inp.focus(); inp.value = searchQuery; }
    });
  });

  // Save word
  app.querySelectorAll('[data-save-pair]').forEach(btn => {
    btn.addEventListener('click', () => {
      const pair = btn.dataset.savePair;
      const input = document.getElementById(`editInput-${pair}`) ||
                    app.querySelector(`[data-edit-pair="${pair}"]`);
      if (input) {
        setUserWord(pair, input.value);
        showToast(`Saved: ${pair} → ${input.value.trim() || '(cleared)'}`);
        render();
      }
    });
  });

  // Save on Enter in edit inputs
  app.querySelectorAll('[data-edit-pair]').forEach(input => {
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const pair = input.dataset.editPair;
        setUserWord(pair, input.value);
        showToast(`Saved: ${pair} → ${input.value.trim() || '(cleared)'}`);
        // In fill-mode practice, saving advances to the next card
        if (practiceSession && practiceSession.mode === 'fill' && practiceSession.flipped) {
          handleAnswer('know');
        } else {
          render();
        }
      }
    });
  });

  // Clear word
  app.querySelectorAll('[data-clear-pair]').forEach(btn => {
    btn.addEventListener('click', () => {
      const pair = btn.dataset.clearPair;
      setUserWord(pair, '');
      showToast(`Cleared: ${pair}`);
      render();
    });
  });

  // Pick suggestion
  app.querySelectorAll('[data-pick-word]').forEach(btn => {
    btn.addEventListener('click', () => {
      const pair = btn.dataset.pickWord;
      const word = btn.dataset.word;
      setUserWord(pair, word);
      const input = document.getElementById(`editInput-${pair}`) ||
                    app.querySelector(`[data-edit-pair="${pair}"]`);
      if (input) input.value = word;
      showToast(`Set: ${pair} → ${word}`);
      // Refresh just the card area if possible, otherwise full render
      render();
    });
  });

  // Browse filter buttons
  app.querySelectorAll('[data-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      browseFilter = btn.dataset.filter;
      render();
      const bs = document.getElementById('browseSearch');
      if (bs) bs.focus();
    });
  });

  // Browse search
  const browseSearchEl = document.getElementById('browseSearch');
  if (browseSearchEl) {
    browseSearchEl.addEventListener('input', e => {
      browseSearch = e.target.value;
      render();
      const bs = document.getElementById('browseSearch');
      if (bs) { bs.focus(); bs.value = browseSearch; bs.setSelectionRange(browseSearch.length, browseSearch.length); }
    });
  }

  // Browse grid & list cell click
  app.querySelectorAll('[data-browse-pair]').forEach(el => {
    el.addEventListener('click', () => {
      const pair = el.dataset.browsePair;
      browseEditPair = browseEditPair === pair ? null : pair;
      render();
      if (browseEditPair) {
        const panel = app.querySelector('.inline-edit');
        if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    });
  });

  // Close inline edit
  const closeEditBtn = app.querySelector('[data-close-edit]');
  if (closeEditBtn) closeEditBtn.addEventListener('click', () => { browseEditPair = null; render(); });

  // Practice mode selection
  app.querySelectorAll('[data-mode]').forEach(card => {
    card.addEventListener('click', () => {
      practiceMode = card.dataset.mode;
      render();
    });
  });

  // Start practice
  const startBtn = document.getElementById('startPractice');
  if (startBtn) {
    startBtn.addEventListener('click', () => {
      const deck = getPracticeQueue(practiceMode);
      if (deck.length === 0) { showToast('No pairs available for this mode'); return; }
      practiceSession = {
        mode: practiceMode,
        deck,
        index: 0,
        flipped: false,
        stats: { correct: 0, incorrect: 0, unsure: 0 },
        done: false
      };
      render();
    });
  }

  // Piece trainer setup
  app.querySelectorAll('[data-piece-type]').forEach(card => {
    card.addEventListener('click', () => {
      const config = getPieceTrainerConfig();
      config.type = card.dataset.pieceType;
      const max = getPiecePromptPool(config.type).length;
      config.length = clampNumber(config.length, 1, max, Math.min(12, max));
      saveState();
      render();
    });
  });

  const pieceLengthInput = document.getElementById('pieceSessionLength');
  if (pieceLengthInput) {
    pieceLengthInput.addEventListener('change', e => {
      const config = getPieceTrainerConfig();
      const max = getPiecePromptPool(config.type).length;
      config.length = clampNumber(e.target.value, 1, max, config.length);
      saveState();
      render();
    });
  }

  const startPieceBtn = document.getElementById('startPiecePractice');
  if (startPieceBtn) {
    startPieceBtn.addEventListener('click', () => {
      const config = getPieceTrainerConfig();
      const session = startPiecePracticeSession({ type: config.type, length: config.length });
      if (!session) { showToast('No stickers available for this setup'); return; }
      render();
    });
  }

  app.querySelectorAll('[data-piece-display-toggle]').forEach(input => {
    input.addEventListener('change', () => {
      const display = getPieceTrainerDisplaySettings();
      display[input.dataset.pieceDisplayToggle] = input.checked;
      saveState();
      render();
    });
  });

  const pieceColorPalette = document.getElementById('pieceColorPalette');
  if (pieceColorPalette) {
    pieceColorPalette.addEventListener('change', () => {
      const display = getPieceTrainerDisplaySettings();
      if (Object.prototype.hasOwnProperty.call(PIECE_COLOR_PALETTES, pieceColorPalette.value)) {
        display.colorPalette = pieceColorPalette.value;
        saveState();
        render();
      }
    });
  }

  const pieceAutoAdvanceMs = document.getElementById('pieceAutoAdvanceMs');
  if (pieceAutoAdvanceMs) {
    pieceAutoAdvanceMs.addEventListener('change', () => {
      const display = getPieceTrainerDisplaySettings();
      display.autoAdvanceMs = clampNumber(pieceAutoAdvanceMs.value, 0, 3000, display.autoAdvanceMs);
      clearPiecePracticeAdvanceTimer();
      saveState();
      if (piecePracticeSession && piecePracticeSession.checked && !piecePracticeSession.done && piecePracticeSession.result && !piecePracticeSession.result.revealed) {
        schedulePiecePracticeAdvance();
      }
      render();
    });
  }

  const pieceRevealBtn = document.getElementById('pieceRevealBtn');
  if (pieceRevealBtn) {
    pieceRevealBtn.addEventListener('click', () => {
      submitPiecePracticeAnswer('', true);
    });
  }

  const pieceNextBtn = document.getElementById('pieceNextBtn');
  if (pieceNextBtn) pieceNextBtn.addEventListener('click', () => advancePiecePractice());

  const endPiecesBtn = document.getElementById('endPiecesSession');
  if (endPiecesBtn) endPiecesBtn.addEventListener('click', () => endPiecePracticeSession());

  const pieceAgainBtn = document.getElementById('piecePracticeAgain');
  if (pieceAgainBtn) {
    pieceAgainBtn.addEventListener('click', () => {
      const session = piecePracticeSession;
      startPiecePracticeSession({ type: session.type, length: session.deck.length });
      render();
    });
  }

  const pieceBackBtn = document.getElementById('pieceBackToSetup');
  if (pieceBackBtn) pieceBackBtn.addEventListener('click', () => { piecePracticeSession = null; render(); });

  // Flip card (forward/fill/weak; reverse uses evaluateReverseAnswer instead)
  const flipCard = document.getElementById('flipCard');
  if (flipCard) {
    flipCard.addEventListener('click', () => {
      if (practiceSession && practiceSession.mode !== 'reverse') {
        practiceSession.flipped = true; render();
      } else if (practiceSession && practiceSession.mode === 'reverse' && !practiceSession.reverseEval) {
        // Allow peeking by clicking the card directly in reverse mode
        practiceSession.flipped = true; render();
      }
    });
  }

  // Answer buttons
  app.querySelectorAll('[data-answer]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!practiceSession || !practiceSession.flipped) return;
      handleAnswer(btn.dataset.answer);
    });
  });

  // End session
  const endBtn = document.getElementById('endSession');
  if (endBtn) endBtn.addEventListener('click', () => {
    if (practiceSession) { practiceSession.done = true; render(); }
  });

  // Practice again / back
  const againBtn = document.getElementById('practiceAgain');
  if (againBtn) againBtn.addEventListener('click', () => {
    const deck = getPracticeQueue(practiceSession.mode);
    practiceSession = {
      mode: practiceSession.mode, deck, index: 0,
      flipped: false, stats: { correct: 0, incorrect: 0, unsure: 0 }, done: false
    };
    render();
  });
  const backBtn = document.getElementById('backToSetup');
  if (backBtn) backBtn.addEventListener('click', () => { practiceSession = null; render(); });

  // Settings
  const exportBtn = document.getElementById('exportBtn');
  if (exportBtn) exportBtn.addEventListener('click', () => {
    const json = exportJSON();
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'bld-letter-pairs.json'; a.click();
    URL.revokeObjectURL(url);
    showToast('Exported successfully');
  });

  const importBtn = document.getElementById('importBtn');
  const importFile = document.getElementById('importFile');
  if (importBtn && importFile) {
    importBtn.addEventListener('click', () => importFile.click());
    importFile.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          importJSON(ev.target.result);
          showToast('Imported successfully');
          render();
        } catch (err) {
          showToast('Import failed: ' + err.message);
        }
        importFile.value = '';
      };
      reader.readAsText(file);
    });
  }

  const clearWordsBtn = document.getElementById('clearWordsBtn');
  if (clearWordsBtn) clearWordsBtn.addEventListener('click', () => {
    if (confirm('Clear all your word assignments? This cannot be undone.')) {
      state.userWords = {};
      saveState();
      showToast('All words cleared');
      render();
    }
  });

  const clearStatsBtn = document.getElementById('clearStatsBtn');
  if (clearStatsBtn) clearStatsBtn.addEventListener('click', () => {
    if (confirm('Clear all practice statistics?')) {
      state.stats = {};
      state.pieceTrainer.stats = {};
      state.pieceTrainer.history = [];
      saveState();
      showToast('All stats cleared');
      render();
    }
  });

  const runTestsBtn = document.getElementById('runTestsBtn');
  if (runTestsBtn) runTestsBtn.addEventListener('click', () => {
    const results = runAllTests();
    renderTestResults(results);
  });

  const ghSignInBtn = document.getElementById('ghSignInBtn');
  if (ghSignInBtn) ghSignInBtn.addEventListener('click', () => { signInWithGitHub(); });

  const ghUseRepoBtn = document.getElementById('ghUseRepoBtn');
  if (ghUseRepoBtn) ghUseRepoBtn.addEventListener('click', () => { connectGitHubRepo(); });

  const ghCreateRepoBtn = document.getElementById('ghCreateRepoBtn');
  if (ghCreateRepoBtn) ghCreateRepoBtn.addEventListener('click', () => { createGitHubRepo(); });

  const ghSaveNowBtn = document.getElementById('ghSaveNowBtn');
  if (ghSaveNowBtn) ghSaveNowBtn.addEventListener('click', () => { saveToGitHub(); });

  const ghRefreshBtn = document.getElementById('ghRefreshBtn');
  if (ghRefreshBtn) ghRefreshBtn.addEventListener('click', () => { refreshGitHubFiles(); });

  const ghDisconnectBtn = document.getElementById('ghDisconnectBtn');
  if (ghDisconnectBtn) ghDisconnectBtn.addEventListener('click', () => { disconnectGitHub(); });

  app.querySelectorAll('[data-gh-load-path]').forEach(btn => {
    btn.addEventListener('click', () => {
      loadGitHubFile(btn.dataset.ghLoadPath, btn.dataset.ghLoadName || btn.textContent.trim());
    });
  });

  // Letter set radio buttons
  app.querySelectorAll('input[name="letterSet"]').forEach(radio => {
    radio.addEventListener('change', () => {
      state.letterSet = radio.value;
      saveState();
      // Reset browse edit so the inline panel doesn't show a now-excluded pair
      browseEditPair = null;
      showToast(`Letter set → ${radio.value}`);
      render();
    });
  });

  // Reverse-mode type input
  const reverseInput = document.getElementById('reverseInput');
  if (reverseInput) {
    reverseInput.addEventListener('input', e => {
      e.target.value = e.target.value.toUpperCase();
    });
    reverseInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (reverseInput.value.length >= 1) evaluateReverseAnswer(reverseInput.value);
      }
      if (e.key === 'Escape') {
        e.preventDefault();
        handleAnswer('skip');
      }
    });
  }
  const reverseSubmitBtn = document.getElementById('reverseSubmitBtn');
  if (reverseSubmitBtn) {
    reverseSubmitBtn.addEventListener('click', () => {
      const ri = document.getElementById('reverseInput');
      if (ri && ri.value.length >= 1) evaluateReverseAnswer(ri.value);
    });
  }
}

// Called when the user submits a typed pair in reverse mode.
function evaluateReverseAnswer(typed) {
  const s = practiceSession;
  if (!s || s.mode !== 'reverse') return;
  const pair = s.deck[s.index];
  const normTyped = normalizeQueryForLetterSet(typed.toUpperCase().trim());
  const correct = normTyped === pair;
  s.reverseEval = { typed: typed.toUpperCase(), correct };
  s.flipped = true; // reveal the card
  render();
}

function handleAnswer(answer) {
  const s = practiceSession;
  const pair = s.deck[s.index];

  if (answer === 'skip') {
    // skip: no stats
  } else {
    if (answer === 'know') s.stats.correct++;
    else if (answer === 'unsure') s.stats.unsure = (s.stats.unsure||0)+1;
    else s.stats.incorrect++;
    updateStats(pair, answer);
  }

  s.index++;
  if (s.index >= s.deck.length) {
    s.done = true;
  } else {
    s.flipped = false;
    s.reverseEval = null; // reset for next reverse card
  }
  render();
}

// ── Keyboard shortcuts ──────────────────────────────────────
document.addEventListener('keydown', e => {
  const inInput = document.activeElement.tagName === 'INPUT' ||
                  document.activeElement.tagName === 'TEXTAREA';

  // '/' to focus search (from anywhere except an input)
  if (e.key === '/' && !inInput) {
    e.preventDefault();
    currentTab = 'search'; render();
    const inp = document.getElementById('searchInput'); if (inp) inp.focus();
    return;
  }
  if (e.key === '/' && currentTab === 'search') {
    const inp = document.getElementById('searchInput');
    if (inp && document.activeElement !== inp) { e.preventDefault(); inp.focus(); }
    return;
  }

  // ── Practice setup (no active session) ──────────────────
  if (!practiceSession && currentTab === 'practice' && !inInput) {
    const modes = ['forward', 'reverse', 'weak', 'fill'];
    const idx = parseInt(e.key) - 1;
    if (idx >= 0 && idx < modes.length) {
      e.preventDefault(); practiceMode = modes[idx]; render(); return;
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      const btn = document.getElementById('startPractice');
      if (btn && !btn.disabled) btn.click();
      return;
    }
  }

  // ── Pieces setup (no active piece session) ──────────────
  if (!piecePracticeSession && currentTab === 'pieces' && !inInput) {
    const types = ['both', 'edges', 'corners'];
    const idx = parseInt(e.key, 10) - 1;
    if (idx >= 0 && idx < types.length) {
      e.preventDefault();
      const config = getPieceTrainerConfig();
      config.type = types[idx];
      const max = getPiecePromptPool(config.type).length;
      config.length = clampNumber(config.length, 1, max, Math.min(12, max));
      saveState();
      render();
      return;
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      const btn = document.getElementById('startPiecePractice');
      if (btn) btn.click();
      return;
    }
  }

  // ── Active session ───────────────────────────────────────
  if (practiceSession && !practiceSession.done && currentTab === 'practice') {
    // Escape ends session
    if (e.key === 'Escape' && !inInput) {
      e.preventDefault();
      practiceSession.done = true; render(); return;
    }

    if (!inInput) {
      const s = practiceSession;

      // Reverse mode: Enter/Space advance after evaluation
      if (s.mode === 'reverse') {
        if ((e.key === 'Enter' || e.key === ' ') && s.reverseEval) {
          e.preventDefault();
          const score = s.reverseEval.correct ? 'know' : 'miss';
          handleAnswer(score); return;
        }
        // 1/2/3 override after evaluation
        if (s.reverseEval) {
          if (e.key === '1') { handleAnswer('miss'); return; }
          if (e.key === '2') { handleAnswer('unsure'); return; }
          if (e.key === '3') { handleAnswer('know'); return; }
        }
        // Before evaluation: Space/Enter = peek (flip without scoring)
        if (!s.reverseEval && (e.key === ' ' || e.key === 'Enter')) {
          e.preventDefault();
          s.flipped = true; render(); return;
        }
        return; // ignore other keys in reverse before evaluation
      }

      // Forward / weak / fill modes
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        if (!s.flipped) { s.flipped = true; render(); return; }
        // Fill mode: Enter after flip = Next
        if (s.mode === 'fill' && s.flipped) { handleAnswer('know'); return; }
      }
      if (s.flipped) {
        if (e.key === '1') { handleAnswer('miss'); return; }
        if (e.key === '2') { handleAnswer('unsure'); return; }
        if (e.key === '3') { handleAnswer('know'); return; }
        if (e.key === 'ArrowLeft')  { handleAnswer('miss'); return; }
        if (e.key === 'ArrowRight') { handleAnswer('know'); return; }
      }
    }
  }

  // ── Active piece session ────────────────────────────────
  if (piecePracticeSession && !piecePracticeSession.done && currentTab === 'pieces') {
    if (e.key === 'Escape' && !inInput) {
      e.preventDefault();
      endPiecePracticeSession();
      return;
    }

    if (!piecePracticeSession.checked) {
      if (!inInput && /^[a-zA-Z]$/.test(e.key)) {
        e.preventDefault();
        submitPiecePracticeAnswer(e.key);
        return;
      }
      if (!inInput && (e.key === ' ' || e.key === 'Enter')) {
        e.preventDefault();
        submitPiecePracticeAnswer('', true);
        return;
      }
      return;
    }

    if (!inInput && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      advancePiecePractice();
      return;
    }
  }

  // Session done: Enter = practice again
  if (practiceSession && practiceSession.done && currentTab === 'practice' && !inInput) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const btn = document.getElementById('practiceAgain');
      if (btn) btn.click();
    }
  }

  if (piecePracticeSession && piecePracticeSession.done && currentTab === 'pieces' && !inInput) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const btn = document.getElementById('piecePracticeAgain');
      if (btn) btn.click();
    }
  }
});

function handleBeforeUnload(event) {
  if (!shouldWarnBeforeUnload()) return;
  event.preventDefault();
  event.returnValue = '';
}

function assert(condition, message) {
  if (!condition) throw new Error(message || 'Assertion failed');
}
function assertEqual(a, b, message) {
  if (JSON.stringify(a) !== JSON.stringify(b))
    throw new Error(message || `Expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`);
}
function assertThrows(fn, message) {
  let threw = false;
  try { fn(); } catch (e) { threw = true; }
  if (!threw) throw new Error(message || 'Expected function to throw');
}

    loadState();
    assertEqual(state.letterSet, 'AY');
    state.letterSet = origLS;
    saveState();
  }],
  ['Settings: importJSON restores letterSet', () => {
    const orig = JSON.parse(JSON.stringify(state));
    importJSON(JSON.stringify({ userWords: {}, stats: {}, letterSet: 'XY' }));
    assertEqual(state.letterSet, 'XY');
    state.userWords = orig.userWords;
    state.stats = orig.stats;
    state.letterSet = orig.letterSet;
    saveState();
  }],
  ['UI: renderSearch produces valid HTML with search input', () => {
    const html = renderSearch();
    assert(html.includes('searchInput'), 'Should contain search input');
    assert(html.includes('search-container'), 'Should contain search container');
  }],
  ['UI: renderBrowse produces 676 grid cells', () => {
    const html = renderBrowse();
    const matches = html.match(/data-browse-pair/g);
    assert(matches && matches.length === 676, `Should have 676 browse pair elements, got ${matches && matches.length}`);
  }],
  ['UI: renderPracticeSetup renders mode cards', () => {
    const savedSession = practiceSession;
    practiceSession = null;
    const html = renderPractice();
    assert(html.includes('data-mode'), 'Should have mode cards');
    assert(html.includes('forward'), 'Should have forward mode');
    assert(html.includes('reverse'), 'Should have reverse mode');
    practiceSession = savedSession;
  }],
  ['UI: renderPieces setup exposes controls and history section', () => {
    const savedSession = piecePracticeSession;
    piecePracticeSession = null;
    const html = renderPieces();
    assert(html.includes('startPiecePractice'), 'Should have piece start button');
    assert(html.includes('pieceSessionLength'), 'Should have session length input');
    assert(html.includes('data-piece-type'), 'Should have piece type selectors');
    piecePracticeSession = savedSession;
  }],
  ['UI: renderHeader shows GitHub save button when cloud data is dirty', () => {
    const origGh = JSON.parse(JSON.stringify(ghConfig));
    const origCloud = JSON.parse(JSON.stringify(cloudState));
    ghConfig = normalizeGitHubConfig({ token: 'token', repo: 'mustafa/test-db', path: 'letter-pairs', filename: 'state.json', username: 'mustafa' });
    cloudState = createDefaultCloudState();
    cloudState.hasUnsavedChanges = true;
    const html = renderHeader();
    assert(html.includes('headerCloudSave'), 'Header should show GitHub save button when dirty');
    ghConfig = origGh;
    cloudState = origCloud;
  }],
  ['UI: renderSettings includes GitHub cloud section', () => {
    const html = renderSettings();
    assert(html.includes('GitHub Cloud Sync'), 'Settings should include GitHub cloud sync section');
    assert(html.includes('ghSignInBtn') || html.includes('ghUseRepoBtn'), 'Settings should include GitHub controls');
  }],
  ['UI: practice session advances on answer', () => {
    const orig = JSON.parse(JSON.stringify(state.userWords));
    state.userWords = { 'AA': 'Aardvark', 'AB': 'ABBA' };
    const savedSession = practiceSession;
    practiceSession = {
      mode: 'forward', deck: ['AA', 'AB'], index: 0,
      flipped: true, stats: { correct: 0, incorrect: 0, unsure: 0 }, done: false
    };
    handleAnswer('know');
    assertEqual(practiceSession.index, 1);
    assertEqual(practiceSession.stats.correct, 1);
    practiceSession = savedSession;
    state.userWords = orig;
    saveState();
  }],
  ['UI: practice session ends when all cards done', () => {
    const orig = JSON.parse(JSON.stringify(state.userWords));
    state.userWords = { 'AA': 'Aardvark' };
    const savedSession = practiceSession;
    practiceSession = {
      mode: 'forward', deck: ['AA'], index: 0,
      flipped: true, stats: { correct: 0, incorrect: 0, unsure: 0 }, done: false
    };
    handleAnswer('know');
    assert(practiceSession.done, 'Session should be done');
    practiceSession = savedSession;
    state.userWords = orig;
    saveState();
  }],
  ['UI: renderPieces session shows prompt and direct-key hint', () => {
    const savedSession = piecePracticeSession;
    const origState = JSON.parse(JSON.stringify(state));
    piecePracticeSession = {
      type: 'both',
      deck: ['corner-UBL-U'],
      index: 0,
      answer: '',
      checked: false,
      result: null,
      stats: { correct: 0, incorrect: 0 },
      done: false,
      historySaved: false
    };
    const html = renderPieces();
    assert(html.includes('Press the matching letter key now.'), 'Should render direct key instruction');
    assert(html.includes('data-piece-sticker="corner-UBL-U"'), 'Should render the current prompt visual');
    assert(html.includes('piece-cubie-scene'), 'Should render the 3D cubie scene');
    assert(!html.includes('piece-face-grid'), 'Should not render the old face-grid visual');
    assert(!html.includes('pieceAnswerInput'), 'Should not render a text input for piece answers');
    piecePracticeSession = savedSession;
    state = origState;
  }],
  ['UI: renderPieces respects hidden prompt code setting', () => {
    const savedSession = piecePracticeSession;
    const origState = JSON.parse(JSON.stringify(state));
    state.pieceTrainer.display.showPromptCode = false;
    state.pieceTrainer.display.showPromptType = false;
    state.pieceTrainer.display.showTargetFace = false;
    state.pieceTrainer.display.showQuestionText = false;
    piecePracticeSession = {
      type: 'both',
      deck: ['corner-DFL-D'],
      index: 0,
      answer: '',
      checked: false,
      result: null,
      stats: { correct: 0, incorrect: 0 },
      done: false,
      historySaved: false
    };
    const html = renderPieces();
    assert(!html.includes('class="piece-prompt-piece">DFL<'), 'Prompt code should be hidden when disabled');
    assert(!html.includes('Target:'), 'Target face label should be hidden when disabled');
    assert(!html.includes('Which Speffz letter'), 'Question text should be hidden when disabled');
    piecePracticeSession = savedSession;
    state = origState;
    saveState();
  }],
  ['Storage: corrupt localStorage handled gracefully', () => {
    const orig = localStorage.getItem(STORAGE_KEY);
    localStorage.setItem(STORAGE_KEY, 'NOT_VALID_JSON!!!');
    const savedState = JSON.parse(JSON.stringify(state));
    loadState();
    assert(typeof state.userWords === 'object', 'Should recover gracefully');
    if (orig !== null) localStorage.setItem(STORAGE_KEY, orig);
    else localStorage.removeItem(STORAGE_KEY);
    state = savedState;
  }],
];

function runAllTests() {
  return TEST_SUITE.map(([name, fn]) => {
    try {
      fn();
      return { name, status: 'pass', error: null };
    } catch (e) {
      return { name, status: 'fail', error: e.message };
    }
  });
}

function renderTestResults(results) {
  const pass = results.filter(r => r.status === 'pass').length;
  const fail = results.filter(r => r.status === 'fail').length;
  const container = document.getElementById('testResultsContainer');
  if (!container) return;

  container.innerHTML = `
  <div class="test-results">
    <div class="test-results-header">
      <span>${results.length} tests</span>
      <span>${pass} passed · ${fail} failed</span>
    </div>
    ${results.map(r => `
      <div class="test-item ${r.status}">
        <span class="test-icon">${r.status === 'pass' ? '✓' : '✗'}</span>
        <div>
          <div class="test-name">${esc(r.name)}</div>
          ${r.error ? `<div class="test-error">${esc(r.error)}</div>` : ''}
        </div>
      </div>
    `).join('')}
  </div>`;
}

// ═══════════════════════════════════════════════════════════
// UTILITY
// ═══════════════════════════════════════════════════════════
function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

// ═══════════════════════════════════════════════════════════
loadState();
loadGitHubConfig();
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('beforeunload', handleBeforeUnload);
}
render();
if (typeof window !== 'undefined' && window.location && window.location.search && /[?&]code=/.test(window.location.search)) {
  processGitHubOAuthRedirect();
}
// Focus search on initial load
(function() {
  const inp = document.getElementById('searchInput');
  if (inp) inp.focus();
})();
</script>
